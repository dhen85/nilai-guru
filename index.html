<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGrade Portal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone untuk kompilasi JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.95); } to { transform: scale(1); } }

    .animate-in.zoom-in-95 { animation: zoomIn 0.2s ease-in-out; }

</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root">
    <!-- Indikator Loading Awal -->
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; background-color:#f8fafc;">
       <div style="width: 40px; height: 40px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
       <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc, getDocs, query, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseAPI = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc, getDocs, query, limit };
  </script>

  <script type="text/babel" data-type="module">
    const initAppInterval = setInterval(() => {
      if (window.FirebaseAPI) {
        clearInterval(initAppInterval);
        
        const { useState, useEffect, useMemo } = React;
        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc, getDocs, query, limit } = window.FirebaseAPI;

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
          apiKey: "AIzaSyAmlyheyJTeeIkKDP8V_65R3DJfah_ERG8",
          authDomain: "nilai-mapel.firebaseapp.com",
          projectId: "nilai-mapel",
          storageBucket: "nilai-mapel.firebasestorage.app",
          messagingSenderId: "753415234022",
          appId: "1:753415234022:web:ee9642f35ca1ec22aff627"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sim-nilai-app';

        const getColPath = (colName) => `artifacts/${appId}/public/data/${colName}`;
        const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

        const LOGO_URL = "https://www.image2url.com/r2/default/images/1789005916309-543685e2-3c1c-4490-80ed-29ecdf376e90.jpeg";

        const Icons = {
          Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
          Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
          Book: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>,
          Database: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>,
          Printer: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>,
          Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
          Save: () => <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>,
          LogOut: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
          Target: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center p-5 border-b border-gray-100 bg-gray-50/50">
                  <h3 className="text-lg font-semibold text-gray-800">{title}</h3>
                  <button onClick={onClose} className="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                  </button>
                </div>
                <div className="p-5">
                  {children}
                </div>
              </div>
            </div>
          );
        };

        const calculateFinalGrade = (gradeData, settings) => {
          const safeAvg = (arr) => {
            if (!arr || !Array.isArray(arr) || arr.length === 0) return 0;
            const validVals = arr.filter(v => v !== null && v !== '');
            if (validVals.length === 0) return 0;
            const nums = validVals.map(Number).filter(n => !isNaN(n));
            if (nums.length === 0) return 0;
            return nums.reduce((a, b) => a + b, 0) / nums.length;
          };

          const avgTugas = safeAvg(gradeData.tugas);
          const avgKeterampilan = safeAvg(gradeData.keterampilan);
          const avgSLM = safeAvg(gradeData.slm);

          let nlmTotal = 0;
          let nlmCount = 0;
          if (avgTugas > 0) { nlmTotal += avgTugas; nlmCount++; }
          if (avgKeterampilan > 0) { nlmTotal += avgKeterampilan; nlmCount++; }
          if (avgSLM > 0) { nlmTotal += avgSLM; nlmCount++; }
          
          const finalNlm = nlmCount > 0 ? (nlmTotal / nlmCount) : 0;

          const sts = Number(gradeData.sts) || 0;
          const sas = Number(gradeData.sas) || 0;

          const wSLM = Number(settings.weightSLM) / 100;
          const wSTS = Number(settings.weightSTS) / 100;
          const wSAS = Number(settings.weightSAS) / 100;

          return (finalNlm * wSLM) + (sts * wSTS) + (sas * wSAS);
        };

        function App() {
          const [user, setUser] = useState(null);
          const [role, setRole] = useState(null); 
          const [loading, setLoading] = useState(true);

          const [settings, setSettings] = useState({ 
            schoolName: "SMA Negeri 1 Nusantara", address: "Jl. Pendidikan No. 1", 
            principal: "Dr. Budi Santoso, M.Pd", nip: "19700101 199512 1 001",
            academicYear: "2026/2027", weightSLM: 40, weightSTS: 30, weightSAS: 30 
          });
          const [classes, setClasses] = useState([]);
          const [subjects, setSubjects] = useState([]);
          const [students, setStudents] = useState([]);
          const [grades, setGrades] = useState([]);
          const [objectives, setObjectives] = useState([]);
          const [teachers, setTeachers] = useState([]);
          const [kktps, setKktps] = useState([]);
          const [remedials, setRemedials] = useState([]);
          
          const [currentTeacher, setCurrentTeacher] = useState(null);
          const [loginData, setLoginData] = useState({ username: '', password: '' });
          const [loginError, setLoginError] = useState('');
          
          // Toast Notification State
          const [toast, setToast] = useState({ show: false, message: '' });

          const showToast = (message) => {
            setToast({ show: true, message });
            setTimeout(() => setToast({ show: false, message: '' }), 3000);
          };

          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined') {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (error) { console.error("Auth error:", error); }
            };

            const unsubscribe = onAuthStateChanged(auth, (user) => {
              setUser(user);
              if (user) setupSubscriptions();
              setLoading(false);
            });

            initAuth();
            return () => unsubscribe();
          }, []);

          const setupSubscriptions = () => {
            const collections = [
              { name: 'settings', setter: (data) => { if (data.length > 0) setSettings(prev => ({...prev, ...data[0]})) } },
              { name: 'classes', setter: setClasses },
              { name: 'subjects', setter: setSubjects },
              { name: 'students', setter: setStudents },
              { name: 'grades', setter: setGrades },
              { name: 'objectives', setter: setObjectives },
              { name: 'teachers', setter: setTeachers },
              { name: 'kktps', setter: setKktps },
              { name: 'remedials', setter: setRemedials }
            ];

            collections.forEach(({name, setter}) => {
              onSnapshot(getColRef(name), (snapshot) => {
                const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setter(data);
              }, (error) => console.error(`Error listening to ${name}:`, error));
            });
          };

          if (loading) return (
            <div className="min-h-screen flex items-center justify-center bg-slate-50">
              <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
          );

          const handleLogin = (e) => {
            e.preventDefault();
            setLoginError('');
            if (loginData.username === 'admin' && loginData.password === 'admin') {
              setRole('admin');
              return;
            }
            const teacher = teachers.find(t => t.username === loginData.username && t.password === loginData.password);
            if (teacher) {
              setCurrentTeacher(teacher);
              setRole('teacher');
            } else {
              setLoginError('Username atau password salah! (Gunakan admin/admin untuk Admin)');
            }
          };

          return (
            <div className="relative">
              {!role ? (
                <div className="min-h-screen flex bg-white">
                  <div className="hidden lg:flex lg:w-1/2 relative bg-gradient-to-br from-indigo-900 via-indigo-800 to-blue-900">
                    <div className="absolute inset-0 flex flex-col justify-center px-16 text-white">
                      <div className="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mb-6 shadow-xl overflow-hidden p-2">
                        <img src={LOGO_URL} alt="Logo" className="w-full h-full object-contain" />
                      </div>
                      <h1 className="text-5xl font-bold mb-4 leading-tight">EduGrade<br/>Portal</h1>
                      <p className="text-xl text-indigo-100 max-w-md">Sistem Informasi Pengolahan Nilai Sumatif Terpadu. Masuk untuk mengelola data akademik sekolah.</p>
                    </div>
                  </div>
                  
                  <div className="w-full lg:w-1/2 flex flex-col justify-between items-center p-8 bg-slate-50">
                    <div className="flex-1 flex items-center justify-center w-full">
                      <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-10 space-y-8 border border-gray-100">
                        <div className="text-center lg:text-left">
                          <h2 className="text-3xl font-bold text-gray-900">Selamat Datang</h2>
                          <p className="text-gray-500 mt-2">Silakan masuk menggunakan akun Anda</p>
                        </div>

                        {loginError && (
                          <div className="p-4 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm font-medium">
                            {loginError}
                          </div>
                        )}

                        <form onSubmit={handleLogin} className="space-y-5">
                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                            <input type="text" required value={loginData.username} onChange={e => setLoginData({...loginData, username: e.target.value})} 
                              className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Masukkan username" />
                          </div>
                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                            <input type="password" required value={loginData.password} onChange={e => setLoginData({...loginData, password: e.target.value})} 
                              className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="••••••••" />
                          </div>
                          <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors shadow-lg shadow-indigo-200 mt-4">
                            Masuk ke Portal
                          </button>
                        </form>
                      </div>
                    </div>
                    <div className="text-center pb-4 pt-8">
                      <p className="text-xs font-medium text-gray-500">sistem manajemen nilai by @pagurudan & AI</p>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="min-h-screen bg-slate-50 flex text-gray-800 font-sans">
                  {role === 'admin' ? (
                    <AdminPortal 
                      settings={settings} classes={classes} subjects={subjects} 
                      students={students} grades={grades} teachers={teachers} objectives={objectives} kktps={kktps} showToast={showToast}
                      onLogout={() => { setRole(null); setLoginData({username: '', password: ''}); setCurrentTeacher(null); }} 
                    />
                  ) : (
                    <TeacherPortal 
                      settings={settings} classes={classes} subjects={subjects} 
                      students={students} grades={grades} objectives={objectives} kktps={kktps} remedials={remedials}
                      teachers={teachers} currentTeacher={currentTeacher} showToast={showToast}
                      onLogout={() => { setRole(null); setLoginData({username: '', password: ''}); setCurrentTeacher(null); }} 
                    />
                  )}
                </div>
              )}
              
              {/* Toast Notification Container */}
              <div className={`fixed bottom-6 right-6 z-[100] transform transition-all duration-300 print:hidden ${toast.show ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none'}`}>
                 <div className="bg-gray-900 text-white px-6 py-3.5 rounded-xl shadow-2xl flex items-center gap-3">
                    <div className="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center shrink-0">
                       <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <span className="font-medium text-sm">{toast.message}</span>
                 </div>
              </div>
            </div>
          );
        }

        function AdminPortal({ settings, classes, subjects, students, grades, teachers, objectives, kktps, showToast, onLogout }) {
          const [activeTab, setActiveTab] = useState('settings');

          const navItems = [
            { id: 'settings', label: 'Pengaturan Sekolah', icon: Icons.Settings },
            { id: 'master', label: 'Data Master', icon: Icons.Database },
            { id: 'monitor', label: 'Monitoring Nilai', icon: Icons.Users },
            { id: 'leger', label: 'Cetak Leger (PDF)', icon: Icons.Printer },
          ];

          return (
            <div className="flex w-full min-h-screen">
              <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col print:hidden">
                <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                  <div className="w-10 h-10 rounded-lg overflow-hidden shrink-0 bg-white">
                     <img src={LOGO_URL} alt="Logo" className="w-full h-full object-cover" />
                  </div>
                  <h2 className="text-white font-bold text-xl">Portal Admin</h2>
                </div>
                <nav className="flex-1 p-4 space-y-2">
                  {navItems.map(item => (
                    <button key={item.id} onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === item.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20' : 'hover:bg-slate-800 hover:text-white'}`}>
                      <item.icon /> <span className="font-medium">{item.label}</span>
                    </button>
                  ))}
                </nav>
                <div className="p-4 border-t border-slate-800">
                  <button onClick={onLogout} className="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-slate-800 hover:text-red-300 rounded-xl transition-colors">
                    <Icons.LogOut /> <span className="font-medium">Keluar</span>
                  </button>
                </div>
              </aside>

              <main className="flex-1 flex flex-col bg-slate-50 min-w-0">
                <header className="bg-white border-b border-gray-200 p-6 flex justify-between items-center print:hidden">
                  <h1 className="text-2xl font-bold text-gray-800">{navItems.find(i => i.id === activeTab)?.label}</h1>
                  <div className="text-sm text-gray-500 font-medium">{settings.schoolName}</div>
                </header>

                <div className="p-6 overflow-auto flex-1">
                  {activeTab === 'settings' && <AdminSettings settings={settings} showToast={showToast} />}
                  {activeTab === 'master' && <AdminMasterData classes={classes} subjects={subjects} students={students} teachers={teachers} showToast={showToast} />}
                  {activeTab === 'monitor' && <AdminMonitor grades={grades} classes={classes} subjects={subjects} teachers={teachers} settings={settings} />}
                  {activeTab === 'leger' && <AdminLeger settings={settings} classes={classes} subjects={subjects} students={students} grades={grades} teachers={teachers} objectives={objectives} kktps={kktps} />}
                </div>
              </main>
            </div>
          );
        }

        function AdminSettings({ settings, showToast }) {
          const [formData, setFormData] = useState(settings);
          const [saving, setSaving] = useState(false);

          useEffect(() => { setFormData(settings); }, [settings]);

          const handleSave = async () => {
            if (!auth.currentUser) return;
            setSaving(true);
            try {
              const settingsRef = getColRef('settings');
              const q = query(settingsRef, limit(1));
              const snapshot = await getDocs(q);
              
              const payload = { ...formData, 
                 weightSLM: Number(formData.weightSLM),
                 weightSTS: Number(formData.weightSTS),
                 weightSAS: Number(formData.weightSAS)
              };

              if (snapshot.empty) {
                await addDoc(settingsRef, payload);
              } else {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', snapshot.docs[0].id), payload);
              }
              showToast("Pengaturan berhasil disimpan");
              setSaving(false);
            } catch (e) { console.error(e); setSaving(false); }
          };

          return (
            <div className="max-w-3xl space-y-8 animate-in fade-in duration-300">
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 className="text-lg font-bold mb-4 flex items-center gap-2"><Icons.Book/> Identitas Sekolah</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-600 mb-1">Nama Sekolah</label>
                    <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" 
                      value={formData.schoolName || ''} onChange={e => setFormData({...formData, schoolName: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-600 mb-1">Alamat Sekolah</label>
                    <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" 
                      value={formData.address || ''} onChange={e => setFormData({...formData, address: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-600 mb-1">Nama Kepala Sekolah</label>
                    <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none"

      function AdminMasterData({ classes, subjects, students, teachers, showToast }) {
        const [activeSubTab, setActiveSubTab] = useState('students');
        const [currentPage, setCurrentPage] = useState(1);
        const [itemsPerPage] = useState(10);
        const [filterClass, setFilterClass] = useState('');

        useEffect(() => { setCurrentPage(1); }, [activeSubTab, filterClass]);

        const [modalOpen, setModalOpen] = useState(false);
        const [editModalOpen, setEditModalOpen] = useState(false);
        const [newItem, setNewItem] = useState({ name: '', className: '', nip: '', subjectName: '', username: '', password: '' });
        const [editItem, setEditItem] = useState(null);

        const handleAdd = async () => {
            if (!auth.currentUser || !newItem.name.trim()) return;
            try {
              const colName = activeSubTab;
              let payload = { name: newItem.name };

              if (activeSubTab === 'students') {
                let classId = '';
                const className = newItem.className.trim();
                if (className) {
                  const existingClass = classes.find(c => c.name.toLowerCase() === className.toLowerCase());
                  if (existingClass) { classId = existingClass.id; } 
                  else {
                    const classRef = await addDoc(getColRef('classes'), { name: className });
                    classId = classRef.id;
                  }
                }
                payload.classId = classId;
              }

              if (activeSubTab === 'teachers') {
                payload = { 
                  name: newItem.name, nip: newItem.nip || '', subjectName: newItem.subjectName || '', 
                  username: newItem.username || '', password: newItem.password || '' 
                };
              }

              if (activeSubTab === 'subjects') {
                 payload = { name: newItem.name };
              }

              await addDoc(getColRef(colName), payload);
              showToast(`Data ${newItem.name} berhasil ditambahkan!`);
              setModalOpen(false);
              setNewItem({ name: '', className: '', nip: '', subjectName: '', username: '', password: '' });
            } catch (e) { console.error(e); }
          };

          const handleDelete = async (id, colName) => {
            if (!auth.currentUser) return;
            try { 
               await deleteDoc(getDocRef(colName, id)); 
               showToast("Data berhasil dihapus");
            } 
            catch (e) { console.error(e); }
          };

          const handleEdit = async () => {
            if (!auth.currentUser || !editItem.name.trim()) return;
            try {
              const colName = activeSubTab;
              let payload = { name: editItem.name };

              if (activeSubTab === 'students') {
                let classId = editItem.classId;
                if (editItem.className) {
                  const className = editItem.className.trim();
                  const existingClass = classes.find(c => c.name.toLowerCase() === className.toLowerCase());
                  if (existingClass) { classId = existingClass.id; } 
                  else {
                    const classRef = await addDoc(getColRef('classes'), { name: className });
                    classId = classRef.id;
                  }
                }
                payload.classId = classId || '';
              }

              if (activeSubTab === 'teachers') {
                 payload = { name: editItem.name, nip: editItem.nip || '', subjectName: editItem.subjectName || '', username: editItem.username || '', password: editItem.password || '' };
              }

              if (activeSubTab === 'subjects') {
                 payload = { name: editItem.name };
              }

              await updateDoc(getDocRef(colName, editItem.id), payload);
              showToast("Perubahan data berhasil disimpan!");
              setEditModalOpen(false);
            } catch (e) { console.error(e); }
          };

      const parseCSVRow = (str) => {
          const arr = [];
          let quote = false;
          let col = '';
          for (let i = 0; i < str.length; i++) {
              let cc = str[i], nc = str[i+1];
              if (cc === '"' && quote && nc === '"') { col += cc; ++i; continue; }
              if (cc === '"') { quote = !quote; continue; }
              if (cc === ',' && !quote) { arr.push(col.trim()); col = ''; continue; }
              col += cc;
          }
          arr.push(col.trim());
          return arr;
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          const csvData = event.target.result;
          const rows = csvData.split(/\r?\n/);
          for (let i = 1; i < rows.length; i++) {
            if (!rows[i].trim()) continue; 
            const cols = parseCSVRow(rows[i]);
            if (cols.length > 0 && cols[0] && cols[0] !== '') {
              const name = cols[0];
              if (activeSubTab === 'students') {
                 const className = cols[1] || '';
                 let classId = '';
                 if (className) {
                   const existingClass = classes.find(c => c.name.toLowerCase() === className.toLowerCase());
                   if (existingClass) {
                     classId = existingClass.id;
                   } else {
                     const classRef = await addDoc(getColRef('classes'), { name: className });
                     classId = classRef.id;
                     classes.push({ id: classRef.id, name: className });
                   }
                 }
                 await addDoc(getColRef('students'), { name, classId });
              } else if (activeSubTab === 'teachers') {
                 const nip = cols[1] || '';
                 const username = cols[2] || '';
                 const password = cols[3] || '';
                 const subjectName = cols[4] || ''; 
                 await addDoc(getColRef('teachers'), { name, nip, username, password, subjectName });
              } else if (activeSubTab === 'subjects') {
                 await addDoc(getColRef('subjects'), { name });
              }
            }
          }
          showToast(`File CSV berhasil diimport ke data ${activeSubTab}!`);
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      const downloadTemplate = () => {

         if (activeSubTab === 'teachers') csvContent += "Nama Guru,NIP,Username,Password,Mata Pelajaran (Tampilan)\n\"Dr. Budi, M.Pd.\",12345,budi,pass123,Matematika\n\"Bu Siti, S.Pd.\",67890,siti,pass456,Bahasa Indonesia";
         if (activeSubTab === 'subjects') csvContent += "Nama Mata Pelajaran\n\"Matematika\"\n\"Bahasa Indonesia\"";
         
         const encodedUri = encodeURI(csvContent);
         const link = document.createElement("a");
         link.setAttribute("href", encodedUri);
         link.setAttribute("download", `template_${activeSubTab}.csv`);
         document.body.appendChild(link);
         link.click();
         document.body.removeChild(link);

      const subTabs = [

      return (

              >
                {tab.label}

          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

              <div className="flex items-center gap-4">
                <h3 className="font-semibold text-gray-700">Daftar {subTabs.find(t=>t.id===activeSubTab)?.label.replace('Data ', '')}</h3>
                {activeSubTab === 'students' && (
                   <select className="border border-gray-300 rounded-lg p-1.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                     value={filterClass} onChange={e => setFilterClass(e.target.value)}>

              </div>
              <div className="flex gap-2">

                <button onClick={() => setModalOpen(true)} className="flex items-center gap-1 bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-100 transition-colors">
                  <Icons.Plus /> Tambah Data
                </button>
              </div>
            </div>
            
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-gray-50 text-gray-600">
                  <tr>
                    <th className="p-4 font-semibold">No</th>
                    <th className="p-4 font-semibold">Nama</th>
                    {activeSubTab === 'students' && <th className="p-4 font-semibold">Kelas</th>}
                    {activeSubTab === 'teachers' && <th className="p-4 font-semibold">Mapel & Info Akun</th>}
                    {activeSubTab === 'subjects' && <th className="p-4 font-semibold">Keterangan</th>}
                    <th className="p-4 font-semibold w-24 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {currentData.length === 0 ? (
                    <tr><td colSpan="4" className="p-8 text-center text-gray-400">Belum ada data</td></tr>

                    currentData.map((item, idx) => (
                      <tr key={item.id} className="hover:bg-gray-50/50">

            {totalPages > 1 && (

                  ))}
                  <button onClick={() => setCurrentPage(currentPage + 1)} disabled={currentPage === totalPages || totalPages === 0} className="px-3 py-1.5 border border-gray-300 rounded-md text-sm disabled:opacity-50 hover:bg-gray-100 font-medium">Next</button>
                </div>

          </div>

          {}
          <Modal isOpen={modalOpen} onClose={() => setModalOpen(false)} title={`Tambah Data ${subTabs.find(t=>t.id===activeSubTab)?.label.replace('Data ', '')}`}>
                <div className="space-y-4">

        function AdminMonitor({ grades, classes, subjects, teachers, settings }) {
          const inputStatus = useMemo(() => {
            const status = [];
            classes.forEach(c => {
              subjects.forEach(s => {
                const count = grades.filter(g => g.classId === c.id && g.subjectId === s.id).length;
                if (count > 0) {
                  // Pencocokan string nama mapel untuk mencari nama guru yang tepat
                  const teacher = teachers?.find(t => t.subjectName && t.subjectName.toLowerCase() === s.name.toLowerCase());
                  status.push({ class: c.name, subject: s.name, count, teacherName: teacher ? teacher.name : 'Guru Mapel' });
                }
              });
            });
            return status;
          }, [grades, classes, subjects, teachers]);

          const handlePrint = () => window.print();

          return (
            <div className="space-y-6 animate-in fade-in duration-300">
              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-6 print:p-0 print:border-none print:shadow-none">
                
                <div className="flex justify-between items-center mb-4 print:hidden">

                    <Icons.Printer /> Cetak PDF
                  </button>
                </div>
                
                <div className="hidden print:block text-center mb-6 pb-4 border-b-2 border-gray-800">
                  <h1 className="text-2xl font-bold uppercase tracking-wider">{settings.schoolName}</h1>
                  <h2 className="text-xl font-bold mt-2">LAPORAN STATUS PENGINPUTAN NILAI</h2>

        function AdminLeger({ settings, classes, subjects, students, grades, teachers, objectives, kktps }) {
          const [selectedClass, setSelectedClass] = useState('');
          const [selectedSubject, setSelectedSubject] = useState('');
          
          const classStudents = students.filter(s => s.classId === selectedClass).sort((a,b) => (a.name || '').localeCompare(b.name || ''));
          
          const isMapelLeger = !!selectedSubject;
          const targetSubjects = isMapelLeger ? subjects.filter(s => s.id === selectedSubject) : subjects;

          const legerData = useMemo(() => {
            if (!selectedClass) return [];
            return classStudents.map(student => {
              const studentGrades = {};
              let total = 0;
              
              if (isMapelLeger) {
                const gradeRecord = grades.find(g => g.studentId === student.id && g.subjectId === selectedSubject) || {};
                const avg = (arr) => arr && arr.length ? (arr.filter(v => v !== null && v !== '').length ? arr.filter(v => v !== null && v !== '').map(Number).reduce((a,b)=>a+b,0)/arr.filter(v => v !== null && v !== '').length : 0) : 0;
                
                const finalGrade = calculateFinalGrade(gradeRecord, settings);
                studentGrades['detail'] = {
                  tugas: avg(gradeRecord.tugas), ket: avg(gradeRecord.keterampilan), slm: avg(gradeRecord.slm),
                  sts: Number(gradeRecord.sts)||0, sas: Number(gradeRecord.sas)||0, final: finalGrade
                };
                total = finalGrade;
              } else {
                subjects.forEach(subject => {
                  const gradeRecord = grades.find(g => g.studentId === student.id && g.subjectId === subject.id);
                  const finalGrade = gradeRecord ? calculateFinalGrade(gradeRecord, settings) : 0;
                  studentGrades[subject.id] = finalGrade;
                  total += finalGrade;
                });
              }
              
              return { student, grades: studentGrades, total, average: isMapelLeger ? total : (subjects.length ? (total / subjects.length) : 0) };
            }).sort((a, b) => b.total - a.total); 
          }, [selectedClass, selectedSubject, classStudents, grades, subjects, settings, isMapelLeger]);

              {selectedClass && (

                    <div className="flex justify-center gap-6 mt-1 font-semibold text-gray-800">
                       <p>Kelas: {classes.find(c => c.id === selectedClass)?.name}</p>

                       <p>Tahun Pelajaran: {settings.academicYear || '-'}</p>
                    </div>
                    {isMapelLeger && (
                       <p className="font-bold text-lg mt-1 text-indigo-700">Mata Pelajaran: {targetSubjects[0]?.name}</p>
                    )}
                  </div>

                  <div className="overflow-x-auto print:overflow-visible">
                    <table className="w-full text-sm border-collapse border border-gray-800">
                      <thead>
                        {isMapelLeger ? (
                          <tr className="bg-gray-100 print:bg-gray-200 text-gray-800">
                            <th className="border border-gray-800 p-2 font-bold w-12 text-center">No</th>

                      </thead>
                      <tbody>
                        {legerData.length === 0 ? (
                          <tr><td colSpan={isMapelLeger ? 9 : subjects.length + 5} className="p-4 text-center border border-gray-800">Tidak ada data siswa</td></tr>
                        ) : (
                          legerData.map((row, idx) => (

                              <td className="border border-gray-800 p-2 font-medium">{row.student.name}</td>
                              {isMapelLeger ? (

                                  <td className="border border-gray-800 p-2 text-center">{row.grades.detail.tugas.toFixed(0)}</td>
                                  <td className="border border-gray-800 p-2 text-center">{row.grades.detail.ket.toFixed(0)}</td>
                                  <td className="border border-gray-800 p-2 text-center">{row.grades.detail.slm.toFixed(0)}</td>
                                  <td className="border border-gray-800 p-2 text-center">{row.grades.detail.sts.toFixed(0)}</td>
                                  <td className="border border-gray-800 p-2 text-center">{row.grades.detail.sas.toFixed(0)}</td>
                                  <td className="border border-gray-800 p-2 text-center font-bold bg-blue-50">{row.grades.detail.final.toFixed(0)}</td>

                  {isMapelLeger && subjectObjectives && subjectObjectives.length > 0 && (

                      <h3 className="font-bold mb-2 text-sm">Tujuan Pembelajaran (TP) yang Diujikan:</h3>

                        {subjectObjectives.map((tp, idx) => (

        function TeacherObjectives({ subjects, classes, objectives, kktps, showToast }) {
          const [selectedClass, setSelectedClass] = useState('');
          const [selectedSubject, setSelectedSubject] = useState('');
          const [objectiveText, setObjectiveText] = useState('');
          
          const [kktpForm, setKktpForm] = useState({ kktp: 75, aMin: 92, aMax: 100, bMin: 84, bMax: 91, cMin: 75, cMax: 83, dMax: 74, docId: null });
          const [savingKktp, setSavingKktp] = useState(false);

          const filteredObjectives = objectives.filter(o => o.subjectId === selectedSubject && o.classId === selectedClass);

          useEffect(() => {
             if (selectedClass && selectedSubject) {
                const setting = kktps.find(k => k.classId === selectedClass && k.subjectId === selectedSubject);
                if (setting) {
                   setKktpForm({
                      kktp: setting.kktp, aMin: setting.aMin, aMax: setting.aMax,
                      bMin: setting.bMin, bMax: setting.bMax, cMin: setting.cMin, cMax: setting.cMax,
                      dMax: setting.dMax, docId: setting.id
                   });
                } else {
                   setKktpForm({ kktp: 75, aMin: 92, aMax: 100, bMin: 84, bMax: 91, cMin: 75, cMax: 83, dMax: 74, docId: null });
                }
             }
          }, [selectedClass, selectedSubject, kktps]);

          const handleKktpChange = (val) => {
            const k = Number(val) || 0;
            if (k === 0) { setKktpForm({ ...kktpForm, kktp: '' }); return; }
            const interval = Math.round((100 - k) / 3);
            
            setKktpForm({ ...kktpForm, kktp: k, aMin: k + (interval * 2), aMax: 100, bMin: k + interval, bMax: k + (interval * 2) - 1, cMin: k, cMax: k + interval - 1, dMax: k - 1 });
          };

          const handleSaveKktp = async () => {
             if (!selectedClass || !selectedSubject) return;
             setSavingKktp(true);
             try {
                const payload = {
                   classId: selectedClass, subjectId: selectedSubject,
                   kktp: Number(kktpForm.kktp), aMin: Number(kktpForm.aMin), aMax: Number(kktpForm.aMax),
                   bMin: Number(kktpForm.bMin), bMax: Number(kktpForm.bMax), cMin: Number(kktpForm.cMin), 
                   cMax: Number(kktpForm.cMax), dMax: Number(kktpForm.dMax)
                };
                if (kktpForm.docId) await updateDoc(getDocRef('kktps', kktpForm.docId), payload);
                else await addDoc(getColRef('kktps'), payload);
                showToast("Pengaturan KKTP berhasil disimpan!");
             } catch (e) { console.error(e); }
             setSavingKktp(false);
          };

          const handleAddTp = async () => {
            if (!objectiveText.trim() || !selectedClass || !selectedSubject) return;
            try {
              await addDoc(getColRef('objectives'), { text: objectiveText, classId: selectedClass, subjectId: selectedSubject });
              showToast("Tujuan Pembelajaran (TP) berhasil ditambahkan!");
              setObjectiveText('');
            } catch (e) { console.error(e); }
          };

          const handleDeleteTp = async (id) => {
            try { 
               await deleteDoc(getDocRef('objectives', id)); 
               showToast("Tujuan Pembelajaran berhasil dihapus.");
            } catch (e) { console.error(e); }
          };

          return (
            <div className="space-y-6 animate-in fade-in duration-300 flex flex-col h-full overflow-auto">
               <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-end shrink-0">
                 <div className="flex-1 min-w-[200px]">
                    <label className="block text-sm font-bold text-gray-700 mb-1">Pilih Kelas</label>
