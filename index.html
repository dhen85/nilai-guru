                      value={selectedClass} onChange={e => setSelectedClass(e.target.value)}>
                      <option value="">-- Pilih Kelas --</option>
                      {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                 </div>
                 <div className="flex-1 min-w-[200px]">
                    <label className="block text-sm font-bold text-gray-700 mb-1">Mata Pelajaran</label>
                    <select className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none bg-white h-[42px]"
                      value={selectedSubject} onChange={e => setSelectedSubject(e.target.value)}>
                      <option value="">-- Pilih Mapel --</option>
                      {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                 </div>
               </div>

               {selectedClass && selectedSubject ? (
                 <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                       <div className="flex justify-between items-center mb-4">
                          <h3 className="font-bold text-lg text-gray-800">Kriteria Ketercapaian Tujuan Pembelajaran (KKTP)</h3>
                          <button onClick={handleSaveKktp} disabled={savingKktp} className="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700 disabled:opacity-50 flex items-center gap-2 text-sm transition-colors">
                             <Icons.Save /> {savingKktp ? 'Menyimpan...' : 'Simpan KKTP'}
                          </button>
                       </div>
                       <div className="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                             <label className="block text-sm font-bold text-slate-700 mb-1">Batas KKTP</label>
                             <input type="number" className="w-full border border-slate-300 rounded-lg p-2 font-bold text-lg outline-none focus:ring-2 focus:ring-slate-500" value={kktpForm.kktp} onChange={e => handleKktpChange(e.target.value)} />
                          </div>
                          <div className="bg-green-50 p-4 rounded-xl border border-green-200">
                             <label className="block text-sm font-bold text-green-800 mb-1">A (Sangat Baik)</label>
                             <div className="flex items-center gap-2"><input type="number" className="w-16 border border-green-300 rounded p-1 text-center text-sm outline-none" value={kktpForm.aMin} onChange={e=>setKktpForm({...kktpForm, aMin: e.target.value})} /><span className="text-xs text-gray-500">-</span><input type="number" className="w-16 border border-green-300 rounded p-1 text-center text-sm outline-none" value={kktpForm.aMax} onChange={e=>setKktpForm({...kktpForm, aMax: e.target.value})} /></div>
                          </div>
                          <div className="bg-blue-50 p-4 rounded-xl border border-blue-200">
                             <label className="block text-sm font-bold text-blue-800 mb-1">B (Baik)</label>
                             <div className="flex items-center gap-2"><input type="number" className="w-16 border border-blue-300 rounded p-1 text-center text-sm outline-none" value={kktpForm.bMin} onChange={e=>setKktpForm({...kktpForm, bMin: e.target.value})} /><span className="text-xs text-gray-500">-</span><input type="number" className="w-16 border border-blue-300 rounded p-1 text-center text-sm outline-none" value={kktpForm.bMax} onChange={e=>setKktpForm({...kktpForm, bMax: e.target.value})} /></div>
                          </div>
                          <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-200">
                             <label className="block text-sm font-bold text-yellow-800 mb-1">C (Cukup)</label>
                             <div className="flex items-center gap-2"><input type="number" className="w-16 border border-yellow-300 rounded p-1 text-center text-sm outline-none" value={kktpForm.cMin} onChange={e=>setKktpForm({...kktpForm, cMin: e.target.value})} /><span className="text-xs text-gray-500">-</span><input type="number" className="w-16 border border-yellow-300 rounded p-1 text-center text-sm outline-none" value={kktpForm.cMax} onChange={e=>setKktpForm({...kktpForm, cMax: e.target.value})} /></div>
                          </div>
                          <div className="bg-red-50 p-4 rounded-xl border border-red-200">
                             <label className="block text-sm font-bold text-red-800 mb-1">D (Kurang)</label>
                             <div className="flex items-center gap-2"><span className="text-sm font-medium text-red-700">0 -</span><input type="number" className="w-16 border border-red-300 rounded p-1 text-center text-sm outline-none" value={kktpForm.dMax} onChange={e=>setKktpForm({...kktpForm, dMax: e.target.value})} /></div>
                          </div>
                       </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                      <div className="p-4 border-b border-gray-200 bg-gray-50 flex gap-2 shrink-0">
                         <input type="text" className="flex-1 border border-gray-300 rounded-lg p-2 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" 
                            placeholder="Masukkan Tujuan Pembelajaran (TP)... (misal: Peserta didik mampu...)" value={objectiveText} onChange={e => setObjectiveText(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAddTp()} />
                         <button onClick={handleAddTp} disabled={!objectiveText.trim()} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-50 transition-colors whitespace-nowrap flex items-center gap-1">
                            <Icons.Plus /> Tambah TP
                         </button>
                      </div>
                      <div className="max-h-80 overflow-auto p-0">
                        {filteredObjectives.length === 0 ? (
                          <div className="p-12 text-center text-gray-400 font-medium">Belum ada Tujuan Pembelajaran (TP) yang ditambahkan untuk kelas ini.</div>
                        ) : (
                          <ul className="divide-y divide-gray-100">
                            {filteredObjectives.map((obj, idx) => (
                              <li key={obj.id} className="p-4 flex items-center gap-4 hover:bg-gray-50 transition-colors">
                                <span className="bg-indigo-100 text-indigo-700 font-bold text-xs px-2.5 py-1 rounded-md shrink-0">TP {idx + 1}</span>
                                <p className="flex-1 text-sm text-gray-700 leading-relaxed">{obj.text}</p>
                                <button onClick={() => handleDeleteTp(obj.id)} className="text-red-400 hover:bg-red-50 hover:text-red-600 px-3 py-1.5 rounded-lg transition-colors shrink-0 font-medium text-sm">Hapus</button>
                              </li>
                            ))}
                          </ul>
                        )}
                      </div>
                    </div>
                 </div>
               ) : (
                 <div className="flex-1 flex items-center justify-center bg-white rounded-xl border border-gray-200 border-dashed p-10">
                    <p className="text-gray-400 text-lg font-medium">Silakan pilih Kelas dan Mata Pelajaran untuk mengelola TP dan KKTP.</p>
                 </div>
               )}
            </div>
          );
        }

        function TeacherInputGrades({ mode, settings, classes, subjects, students, grades, objectives, kktps, currentTeacher, showToast }) {
          const [selectedClass, setSelectedClass] = useState('');
          const [selectedSubject, setSelectedSubject] = useState('');
          const [cols, setCols] = useState({ tugas: 1, keterampilan: 1, slm: 1 });
          const [tempGrades, setTempGrades] = useState({});
          const [saving, setSaving] = useState(false);

          // PENGURUTAN ABJAD SISWA DENGAN SORT()
          const classStudents = useMemo(() => {
             return students.filter(s => s.classId === selectedClass).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          }, [students, selectedClass]);
          
          const currentKktp = kktps.find(k => k.classId === selectedClass && k.subjectId === selectedSubject);

          const getPredikat = (nilai) => {
             if (!currentKktp) return '-';
             const n = Math.round(nilai);
             if (n >= currentKktp.aMin) return 'A';
             if (n >= currentKktp.bMin) return 'B';
             if (n >= currentKktp.cMin) return 'C';
             return 'D';
          };

          useEffect(() => {
            if (!selectedClass || !selectedSubject) return;
            
            const newTemp = {};
            let maxTugas = 1, maxKet = 1, maxSlm = 1;

            classStudents.forEach(student => {
              const existing = grades.find(g => g.studentId === student.id && g.subjectId === selectedSubject && g.classId === selectedClass);
              if (existing) {
                newTemp[student.id] = {
                  tugas: existing.tugas || [''],
                  keterampilan: existing.keterampilan || [''],
                  slm: existing.slm || [''],
                  sts: existing.sts || '',
                  sas: existing.sas || '',
                  id: existing.id
                };
                maxTugas = Math.max(maxTugas, (existing.tugas || []).length);
                maxKet = Math.max(maxKet, (existing.keterampilan || []).length);
                maxSlm = Math.max(maxSlm, (existing.slm || []).length);
              } else {
                newTemp[student.id] = { tugas: [''], keterampilan: [''], slm: [''], sts: '', sas: '' };
              }
            });

            setTempGrades(newTemp);
            setCols({ tugas: Math.max(1, maxTugas), keterampilan: Math.max(1, maxKet), slm: Math.max(1, maxSlm) });
          }, [selectedClass, selectedSubject, classStudents, grades]);

          const handleGradeChange = (studentId, category, index, value) => {
            setTempGrades(prev => {
              const studentData = { ...prev[studentId] };
              if (category === 'sts' || category === 'sas') {
                studentData[category] = value;
              } else {
                const arr = [...studentData[category]];
                while(arr.length <= index) arr.push('');
                arr[index] = value;
                studentData[category] = arr;
              }
              return { ...prev, [studentId]: studentData };
            });
          };

          const addColumn = (category) => {
            setCols(prev => ({ ...prev, [category]: prev[category] + 1 }));
          };

          // FUNGSI PEMBERSIH ARRAY (Mempertahankan null di tengah, membuang di akhir)
          const cleanPreservedArray = (arr) => {
             const mapped = arr.map(v => (v === '' || v === null || v === undefined) ? null : Number(v));
             while (mapped.length > 0 && mapped[mapped.length - 1] === null) {
                 mapped.pop();
             }
             return mapped;
          };

          const handleSaveAll = async () => {
            if (!auth.currentUser || !selectedClass || !selectedSubject) return;
            setSaving(true);
            try {
              const promises = classStudents.map(student => {
                const data = tempGrades[student.id];
                
                // Jangan gunakan .filter(v => v!==null) agar indeks tetap sejajar!
                const cleanTugas = cleanPreservedArray(data.tugas);
                const cleanKet = cleanPreservedArray(data.keterampilan);
                const cleanSlm = cleanPreservedArray(data.slm);
                
                const payload = {
                  studentId: student.id,
                  classId: selectedClass,
                  subjectId: selectedSubject,
                  tugas: cleanTugas,
                  keterampilan: cleanKet,
                  slm: cleanSlm,
                  sts: data.sts !== '' ? Number(data.sts) : null,
                  sas: data.sas !== '' ? Number(data.sas) : null,
                };

                if (data.id) return updateDoc(getDocRef('grades', data.id), payload);
                else return addDoc(getColRef('grades'), payload);
              });

              await Promise.all(promises);
              showToast("Data nilai berhasil disimpan!");
            } catch (e) {
              console.error(e);
            }
            setSaving(false);
          };

          return (
            <div className="flex flex-col h-full space-y-4 animate-in fade-in duration-300">
              <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-end shrink-0">
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-sm font-bold text-gray-700 mb-1">Kelas</label>
                  <select className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                    value={selectedClass} onChange={e => setSelectedClass(e.target.value)}>
                    <option value="">-- Pilih Kelas --</option>
                    {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>
                <div className="flex-1 min-w-[200px]">
                  <label className="block text-sm font-bold text-gray-700 mb-1">Mata Pelajaran</label>
                  <select className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                    value={selectedSubject} onChange={e => setSelectedSubject(e.target.value)}>
                    <option value="">-- Pilih Mapel --</option>
                    {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                </div>
                <button onClick={handleSaveAll} disabled={saving || !selectedClass || !selectedSubject || classStudents.length===0} 
                  className="flex items-center justify-center gap-2 bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700 disabled:opacity-50 h-[42px] min-w-[140px] transition-colors">
                  <Icons.Save /> {saving ? 'Menyimpan...' : 'Simpan Nilai'}
                </button>
              </div>

              {selectedClass && selectedSubject ? (
                classStudents.length === 0 ? (
                   <div className="flex-1 flex items-center justify-center bg-white rounded-xl border border-gray-200">
                     <p className="text-gray-400 font-medium">Belum ada siswa di kelas ini.</p>
                   </div>
                ) : (
                  <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                    <div className="p-3 border-b border-gray-200 bg-gray-50 flex gap-2 overflow-x-auto shrink-0 items-center justify-between">
                      <div className="flex gap-2">
                         {mode === 'tugas' && <button onClick={()=>addColumn('tugas')} className="text-xs bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded shadow-sm hover:bg-gray-100 font-semibold flex items-center gap-1 whitespace-nowrap"><Icons.Plus /> Kolom Tugas</button>}
                         {mode === 'keterampilan' && <button onClick={()=>addColumn('keterampilan')} className="text-xs bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded shadow-sm hover:bg-gray-100 font-semibold flex items-center gap-1 whitespace-nowrap"><Icons.Plus /> Kolom Keterampilan</button>}
                         {mode === 'slm' && <button onClick={()=>addColumn('slm')} className="text-xs bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded shadow-sm hover:bg-gray-100 font-semibold flex items-center gap-1 whitespace-nowrap"><Icons.Plus /> Kolom Sumatif Materi</button>}
                         {mode === 'rekap' && <div className="text-sm text-gray-600 font-medium px-2 py-1">Rekapitulasi Nilai Akhir Siswa</div>}
                         {(mode === 'sts' || mode === 'sas') && <div className="text-sm text-gray-600 font-medium px-2 py-1">Input Nilai {mode.toUpperCase()}</div>}
                      </div>
                      {mode === 'rekap' && currentKktp && (
                         <div className="text-xs font-semibold text-gray-500 bg-gray-200 px-3 py-1.5 rounded-md">KKTP: {currentKktp.kktp}</div>
                      )}
                    </div>
                    
                    <div className="flex-1 overflow-auto">
                      <table className="w-full text-sm text-center border-collapse">
                        <thead className="bg-gray-100 text-gray-700 sticky top-0 z-10 shadow-sm">
                          <tr>
                            <th rowSpan={mode === 'tugas' || mode === 'keterampilan' || mode === 'slm' ? "2" : "1"} className="border border-gray-200 p-2 min-w-[200px] sticky left-0 bg-gray-100 z-20 shadow-[1px_0_0_0_#e5e7eb]">Nama Siswa</th>
                            {(mode === 'tugas' || mode === 'rekap') && <th colSpan={mode==='rekap'? 1 : cols.tugas} className="border border-gray-200 p-2 bg-blue-50 text-blue-800">{mode==='rekap'?'Rata-rata Tugas':'Nilai Tugas'}</th>}
                            {(mode === 'keterampilan' || mode === 'rekap') && <th colSpan={mode==='rekap'? 1 : cols.keterampilan} className="border border-gray-200 p-2 bg-orange-50 text-orange-800">{mode==='rekap'?'Rata-rata Keterampilan':'Keterampilan / Projek'}</th>}
                            {(mode === 'slm' || mode === 'rekap') && <th colSpan={mode==='rekap'? 1 : cols.slm} className="border border-gray-200 p-2 bg-purple-50 text-purple-800">{mode==='rekap'?'Rata-rata SLM':'Sumatif Lingkup Materi'}</th>}
                            {(mode === 'sts' || mode === 'rekap') && <th rowSpan={mode === 'tugas' || mode === 'keterampilan' || mode === 'slm' ? "2" : "1"} className="border border-gray-200 p-2 w-20 bg-green-50 text-green-800">STS</th>}
                            {(mode === 'sas' || mode === 'rekap') && <th rowSpan={mode === 'tugas' || mode === 'keterampilan' || mode === 'slm' ? "2" : "1"} className="border border-gray-200 p-2 w-20 bg-green-50 text-green-800">SAS</th>}
                            {mode === 'rekap' && <th rowSpan="1" className="border border-gray-200 p-2 w-24 bg-gray-800 text-white shadow-[-1px_0_0_0_#e5e7eb]">Nilai Akhir (NA)</th>}
                            {mode === 'rekap' && <th rowSpan="1" className="border border-gray-200 p-2 w-16 bg-yellow-100 text-yellow-800">Predikat</th>}
                          </tr>
                          {(mode === 'tugas' || mode === 'keterampilan' || mode === 'slm') && (
                            <tr>
                              {mode === 'tugas' && Array.from({length: cols.tugas}).map((_, i) => (
                                 <th key={`th-t-${i}`} className="border border-gray-200 p-1 w-24 bg-blue-50/50 text-xs text-gray-600 font-medium align-top">
                                   <div className="mb-1">T{i+1}</div>
                                   <select className="w-full text-[10px] p-1 rounded border border-gray-300 bg-white" title="Pilih Tujuan Pembelajaran">
                                     <option value="">-- Pilih TP --</option>
                                     {objectives?.filter(o => o.classId === selectedClass && o.subjectId === selectedSubject).map((tp, idx) => (
                                       <option key={tp.id} value={tp.id}>TP {idx+1}</option>
                                     ))}
                                   </select>
                                 </th>
                              ))}
                              {mode === 'keterampilan' && Array.from({length: cols.keterampilan}).map((_, i) => (
                                 <th key={`th-k-${i}`} className="border border-gray-200 p-1 w-24 bg-orange-50/50 text-xs text-gray-600 font-medium align-top">
                                   <div className="mb-1">K{i+1}</div>
                                   <select className="w-full text-[10px] p-1 rounded border border-gray-300 bg-white" title="Pilih Tujuan Pembelajaran">
                                     <option value="">-- Pilih TP --</option>
                                     {objectives?.filter(o => o.classId === selectedClass && o.subjectId === selectedSubject).map((tp, idx) => (
                                       <option key={tp.id} value={tp.id}>TP {idx+1}</option>
                                     ))}
                                   </select>
                                 </th>
                              ))}
                              {mode === 'slm' && Array.from({length: cols.slm}).map((_, i) => (
                                 <th key={`th-s-${i}`} className="border border-gray-200 p-1 w-24 bg-purple-50/50 text-xs text-gray-600 font-medium align-top">
                                   <div className="mb-1">S{i+1}</div>
                                   <select className="w-full text-[10px] p-1 rounded border border-gray-300 bg-white" title="Pilih Tujuan Pembelajaran">
                                     <option value="">-- Pilih TP --</option>
                                     {objectives?.filter(o => o.classId === selectedClass && o.subjectId === selectedSubject).map((tp, idx) => (
                                       <option key={tp.id} value={tp.id}>TP {idx+1}</option>
                                     ))}
                                   </select>
                                 </th>
                              ))}
                            </tr>
                          )}
                        </thead>
                        <tbody>
                          {classStudents.map((student, idx) => {
                            const data = tempGrades[student.id] || { tugas: [], keterampilan: [], slm: [], sts: '', sas: '' };
                            const finalG = calculateFinalGrade(data, settings);
                            const predikat = getPredikat(finalG);
                            
                            const safeAvg = (arr) => {
                              if (!arr || !Array.isArray(arr) || arr.length === 0) return 0;
                              const validVals = arr.filter(v => v !== null && v !== '');
                              if (validVals.length === 0) return 0;
                              const nums = validVals.map(Number).filter(n => !isNaN(n));
                              if (nums.length === 0) return 0;
                              return nums.reduce((a, b) => a + b, 0) / nums.length;
                            };
                            const avgT = safeAvg(data.tugas);
                            const avgK = safeAvg(data.keterampilan);
                            const avgS = safeAvg(data.slm);
                            
                            return (
                              <tr key={student.id} className="hover:bg-gray-50/50">
                                <td className="border border-gray-200 p-2 text-left font-medium sticky left-0 bg-white z-10 shadow-[1px_0_0_0_#e5e7eb]">
                                  {idx+1}. {student.name}
                                </td>
                                {mode === 'tugas' && Array.from({length: cols.tugas}).map((_, i) => (
                                  <td key={`t-${i}`} className="border border-gray-200 p-1">
                                    <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-transparent hover:bg-gray-50 outline-none transition-colors"
                                      value={data.tugas[i] !== undefined && data.tugas[i] !== null ? data.tugas[i] : ''} onChange={e => handleGradeChange(student.id, 'tugas', i, e.target.value)} />
                                  </td>
                                ))}
                                {mode === 'rekap' && <td className="border border-gray-200 p-2 text-center bg-blue-50/30 font-medium">{avgT.toFixed(1)}</td>}
                                
                                {mode === 'keterampilan' && Array.from({length: cols.keterampilan}).map((_, i) => (
                                  <td key={`k-${i}`} className="border border-gray-200 p-1">
                                    <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-orange-500 focus:ring-1 focus:ring-orange-500 bg-transparent hover:bg-gray-50 outline-none transition-colors"
                                      value={data.keterampilan[i] !== undefined && data.keterampilan[i] !== null ? data.keterampilan[i] : ''} onChange={e => handleGradeChange(student.id, 'keterampilan', i, e.target.value)} />
                                  </td>
                                ))}
                                {mode === 'rekap' && <td className="border border-gray-200 p-2 text-center bg-orange-50/30 font-medium">{avgK.toFixed(1)}</td>}
                                
                                {mode === 'slm' && Array.from({length: cols.slm}).map((_, i) => (
                                  <td key={`s-${i}`} className="border border-gray-200 p-1">
                                    <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-purple-500 focus:ring-1 focus:ring-purple-500 bg-transparent hover:bg-gray-50 outline-none transition-colors"
                                      value={data.slm[i] !== undefined && data.slm[i] !== null ? data.slm[i] : ''} onChange={e => handleGradeChange(student.id, 'slm', i, e.target.value)} />
                                  </td>
                                ))}
                                {mode === 'rekap' && <td className="border border-gray-200 p-2 text-center bg-purple-50/30 font-medium">{avgS.toFixed(1)}</td>}
                                
                                {(mode === 'sts' || mode === 'rekap') && (
                                  <td className="border border-gray-200 p-1">
                                    {mode === 'rekap' ? <div className="p-1 font-bold text-green-700">{data.sts || 0}</div> :
                                    <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-green-500 focus:ring-1 focus:ring-green-500 font-bold text-green-700 bg-transparent hover:bg-green-50 outline-none"
                                      value={data.sts} onChange={e => handleGradeChange(student.id, 'sts', null, e.target.value)} />}
                                  </td>
                                )}
                                {(mode === 'sas' || mode === 'rekap') && (
                                  <td className="border border-gray-200 p-1">
                                    {mode === 'rekap' ? <div className="p-1 font-bold text-green-700">{data.sas || 0}</div> :
                                    <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-green-500 focus:ring-1 focus:ring-green-500 font-bold text-green-700 bg-transparent hover:bg-green-50 outline-none"
                                      value={data.sas} onChange={e => handleGradeChange(student.id, 'sas', null, e.target.value)} />}
                                  </td>
                                )}
                                
                                {mode === 'rekap' && (
                                  <td className="border border-gray-200 p-2 font-bold text-lg bg-gray-50 shadow-[-1px_0_0_0_#e5e7eb]">
                                    {finalG.toFixed(0)}
                                  </td>
                                )}
                                {mode === 'rekap' && (
                                  <td className={`border border-gray-200 p-2 font-bold text-lg shadow-[-1px_0_0_0_#e5e7eb] ${predikat === 'D' ? 'text-red-600 bg-red-50' : 'text-indigo-600 bg-indigo-50'}`}>
                                    {predikat}
                                  </td>
                                )}
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )
              ) : (
                <div className="flex-1 flex items-center justify-center bg-white rounded-xl border border-gray-200 border-dashed">
                  <p className="text-gray-400 text-lg font-medium">Silakan pilih Kelas dan Mata Pelajaran untuk mulai menginput nilai.</p>
                </div>
              )}
            </div>
          );
        }

        function TeacherRemedial({ settings, classes, subjects, students, remedials, currentTeacher, showToast }) {
          const [selectedType, setSelectedType] = useState('SLM'); 
          const [slmCols, setSlmCols] = useState(1);
          const [selectedClass, setSelectedClass] = useState('');
          const [selectedSubject, setSelectedSubject] = useState('');
          
          const [katrolMin, setKatrolMin] = useState(75);
          const [katrolMax, setKatrolMax] = useState(85);

          // PENGURUTAN ABJAD SISWA DENGAN SORT()
          const classStudents = useMemo(() => {
             return students.filter(s => s.classId === selectedClass).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          }, [students, selectedClass]);
          
          const [tempRemedial, setTempRemedial] = useState({});
          const [saving, setSaving] = useState(false);

          useEffect(() => {
             if (!selectedClass || !selectedSubject) return;
             const newTemp = {};
             let maxSlm = 1;
             
             classStudents.forEach(student => {
                const recs = remedials.filter(r => r.studentId === student.id && r.subjectId === selectedSubject && r.classId === selectedClass && r.type === selectedType);
                if (selectedType === 'SLM') {
                   const slmData = [];
                   recs.forEach(r => {
                      slmData[r.index] = { original: r.original, remedial: r.remedial, final: r.final, id: r.id };
                      maxSlm = Math.max(maxSlm, r.index + 1);
                   });
                   newTemp[student.id] = { slm: slmData };
                } else {
                   const r = recs[0];
                   if (r) {
                      newTemp[student.id] = { original: r.original, remedial: r.remedial, final: r.final, id: r.id };
                   } else {
                      newTemp[student.id] = { original: '', remedial: '', final: '' };
                   }
                }
             });
             setTempRemedial(newTemp);
             if (selectedType === 'SLM') setSlmCols(maxSlm);
          }, [selectedClass, selectedSubject, selectedType, classStudents, remedials]);

          const hitungKatrol = (nilaiRemed) => {
             if (!nilaiRemed) return '';
             const n = Number(nilaiRemed);
             const kMin = Number(katrolMin);
             const kMax = Number(katrolMax);
             if(n <= 0) return '';
             const res = Math.round(kMin + (n/100) * (kMax - kMin));
             return res > 100 ? 100 : res;
          }

          const handleChange = (studentId, field, value, slmIndex = 0) => {
            setTempRemedial(prev => {
              const current = prev[studentId] || (selectedType === 'SLM' ? { slm: [] } : { original: '', remedial: '', final: '' });
              
              if (selectedType === 'SLM') {
                 const arr = [...(current.slm || [])];
                 const obj = arr[slmIndex] || { original: '', remedial: '', final: '' };
                 obj[field] = value;
                 if (field === 'remedial') obj.final = hitungKatrol(value); 
                 arr[slmIndex] = obj;
                 return { ...prev, [studentId]: { slm: arr } };
              } else {
                 const newObj = { ...current, [field]: value };
                 if (field === 'remedial') newObj.final = hitungKatrol(value); 
                 return { ...prev, [studentId]: newObj };
              }
            });
          };

          const handleSave = async () => {
             if (!selectedClass || !selectedSubject) return;
             setSaving(true);
             try {
                const promises = [];
                classStudents.forEach(student => {
                   const data = tempRemedial[student.id];
                   if(!data) return;

                   if (selectedType === 'SLM') {
                      (data.slm || []).forEach((item, idx) => {
                         if (!item) return;
                         const payload = {
                            studentId: student.id, classId: selectedClass, subjectId: selectedSubject,
                            type: 'SLM', index: idx, original: item.original || '', remedial: item.remedial || '', final: item.final || ''
                         };
                         if (item.original || item.remedial || item.final) {
                            if (item.id) promises.push(updateDoc(getDocRef('remedials', item.id), payload));
                            else promises.push(addDoc(getColRef('remedials'), payload));
                         }
                      });
                   } else {
                      const payload = {
                         studentId: student.id, classId: selectedClass, subjectId: selectedSubject,
                         type: selectedType, original: data.original || '', remedial: data.remedial || '', final: data.final || ''
                      };
                      if (data.original || data.remedial || data.final) {
                         if (data.id) promises.push(updateDoc(getDocRef('remedials', data.id), payload));
                         else promises.push(addDoc(getColRef('remedials'), payload));
                      }
                   }
                });
                await Promise.all(promises);
                showToast("Nilai Remedial berhasil disimpan!");
             } catch (e) { console.error(e); }
             setSaving(false);
          };

          const handlePrint = () => { window.print(); };

          const className = classes.find(c => c.id === selectedClass)?.name || '';
          const subjectName = subjects.find(s => s.id === selectedSubject)?.name || '';

          return (
            <div className="flex flex-col h-full space-y-4 animate-in fade-in duration-300">
               <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-end shrink-0 print:hidden">
                 <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">Jenis Remedial</label>
                    <select className="w-full border border-gray-300 rounded-lg p-2 outline-none bg-white"
                      value={selectedType} onChange={e => setSelectedType(e.target.value)}>
                      <option value="SLM">Sumatif Lingkup Materi (SLM)</option>
                      <option value="STS">Sumatif Tengah Semester (STS)</option>
                      <option value="SAS">Sumatif Akhir Semester (SAS)</option>
                    </select>
                 </div>
                 <div className="flex-1 min-w-[150px]">
                    <label className="block text-sm font-bold text-gray-700 mb-1">Kelas</label>
                    <select className="w-full border border-gray-300 rounded-lg p-2 outline-none bg-white"
                      value={selectedClass} onChange={e => setSelectedClass(e.target.value)}>
                      <option value="">-- Pilih Kelas --</option>
                      {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                 </div>
                 <div className="flex-1 min-w-[150px]">
                    <label className="block text-sm font-bold text-gray-700 mb-1">Mata Pelajaran</label>
                    <select className="w-full border border-gray-300 rounded-lg p-2 outline-none bg-white"
                      value={selectedSubject} onChange={e => setSelectedSubject(e.target.value)}>
                      <option value="">-- Pilih Mapel --</option>
                      {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                 </div>
                 
                 <div className="flex items-center gap-2 bg-yellow-50 p-2 rounded-lg border border-yellow-200">
                    <div>
                       <label className="block text-xs font-bold text-yellow-800 mb-1">Katrol Min</label>
                       <input type="number" className="w-16 border border-yellow-300 rounded p-1 text-center text-sm outline-none bg-white" value={katrolMin} onChange={e=>setKatrolMin(e.target.value)} />
                    </div>
                    <div>
                       <label className="block text-xs font-bold text-yellow-800 mb-1">Katrol Max</label>
                       <input type="number" className="w-16 border border-yellow-300 rounded p-1 text-center text-sm outline-none bg-white" value={katrolMax} onChange={e=>setKatrolMax(e.target.value)} />
                    </div>
                 </div>

                 <button onClick={handleSave} disabled={saving || !selectedClass || !selectedSubject} className="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700 transition-colors h-[42px] disabled:opacity-50">
                   {saving ? 'Menyimpan...' : 'Simpan Remedial'}
                 </button>
                 
                 <button onClick={handlePrint} disabled={!selectedClass || !selectedSubject} className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2 rounded-lg font-semibold hover:bg-slate-900 transition-colors h-[42px] disabled:opacity-50">
                   <Icons.Printer /> Cetak PDF
                 </button>
               </div>

               {selectedClass && selectedSubject ? (
                 <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden print:border-none print:shadow-none print:p-0">
                   
                   <div className="hidden print:block text-center mb-6 pb-4 border-b-2 border-gray-800">
                      <h1 className="text-2xl font-bold uppercase tracking-wider">{settings.schoolName}</h1>
                      <h2 className="text-xl font-bold mt-2">LAPORAN PELAKSANAAN REMEDIAL</h2>
                      <div className="flex justify-center gap-6 mt-2 font-semibold text-gray-800">
                         <p>Mata Pelajaran: {subjectName}</p>
                         <p>Kelas: {className}</p>
                         <p>Jenis: {selectedType}</p>
                      </div>
                   </div>

                   <div className="p-3 border-b border-gray-200 bg-red-50 text-red-700 font-semibold text-sm shrink-0 flex justify-between items-center print:hidden">
                     <span>Catatan: Nilai Remedial ini berdiri sendiri dan tidak menimpa nilai di buku induk. Nilai akhir dihitung otomatis berdasarkan rentang katrol.</span>
                     {selectedType === 'SLM' && (
                        <button onClick={() => setSlmCols(slmCols + 1)} className="bg-white border border-red-200 text-red-700 px-3 py-1 text-xs rounded hover:bg-red-100 flex items-center gap-1 font-bold"><Icons.Plus /> Kolom SLM</button>
                     )}
                   </div>
                   
                   <div className="flex-1 overflow-auto print:overflow-visible">
                     <table className="w-full text-sm text-center border-collapse print:border-gray-800">
                       <thead className="bg-gray-100 text-gray-700 sticky top-0 z-10 shadow-sm print:static print:bg-gray-200">
                         <tr>
                           <th rowSpan="2" className="border border-gray-200 print:border-gray-800 p-2 min-w-[200px] sticky left-0 bg-gray-100 print:bg-gray-200 z-20 text-left">Nama Siswa</th>
                           {selectedType === 'SLM' ? (
                              Array.from({length: slmCols}).map((_, i) => (
                                 <th key={`h-${i}`} colSpan="3" className="border border-gray-200 print:border-gray-800 p-1 bg-slate-200 text-slate-800">SLM Ke-{i+1}</th>
                              ))
                           ) : (
                              <th colSpan="3" className="border border-gray-200 print:border-gray-800 p-1 bg-slate-200 text-slate-800">Nilai {selectedType}</th>
                           )}
                         </tr>
                         <tr>
                           {selectedType === 'SLM' ? (
                              Array.from({length: slmCols}).map((_, i) => (
                                 <React.Fragment key={`sub-${i}`}>
                                    <th className="border border-gray-200 print:border-gray-800 p-1 bg-gray-50 text-xs w-20">Asli</th>
                                    <th className="border border-gray-200 print:border-gray-800 p-1 bg-yellow-50 text-yellow-800 text-xs w-20">Remed</th>
                                    <th className="border border-gray-200 print:border-gray-800 p-1 bg-green-50 text-green-800 text-xs w-20">Katrol</th>
                                 </React.Fragment>
                              ))
                           ) : (
                              <React.Fragment>
                                 <th className="border border-gray-200 print:border-gray-800 p-1 bg-gray-50 text-xs w-24">Nilai Asli</th>
                                 <th className="border border-gray-200 print:border-gray-800 p-1 bg-yellow-50 text-yellow-800 text-xs w-24">Nilai Remedial</th>
                                 <th className="border border-gray-200 print:border-gray-800 p-1 bg-green-50 text-green-800 text-xs w-24">Nilai Akhir (Katrol)</th>
                              </React.Fragment>
                           )}
                         </tr>
                       </thead>
                       <tbody>
                         {classStudents.map((student, idx) => {
                            const data = tempRemedial[student.id] || (selectedType==='SLM'? {slm:[]} : {original:'', remedial:'', final:''});
                            
                            return (
                              <tr key={student.id} className="hover:bg-gray-50/50">
                                <td className="border border-gray-200 print:border-gray-800 p-2 text-left font-medium sticky left-0 bg-white print:bg-transparent z-10">{idx+1}. {student.name}</td>
                                
                                {selectedType === 'SLM' ? (
                                   Array.from({length: slmCols}).map((_, i) => {
                                      const d = (data.slm || [])[i] || {};
                                      return (
                                        <React.Fragment key={`col-${i}`}>
                                           <td className="border border-gray-200 print:border-gray-800 p-1 print:p-2"><input type="number" className="w-full text-center p-1 outline-none print:hidden" value={d.original||''} onChange={e=>handleChange(student.id, 'original', e.target.value, i)} /><span className="hidden print:inline">{d.original||'-'}</span></td>
                                           <td className="border border-gray-200 print:border-gray-800 p-1 bg-yellow-50/30 print:p-2"><input type="number" className="w-full text-center p-1 outline-none bg-transparent print:hidden" value={d.remedial||''} onChange={e=>handleChange(student.id, 'remedial', e.target.value, i)} /><span className="hidden print:inline">{d.remedial||'-'}</span></td>
                                           <td className="border border-gray-200 print:border-gray-800 p-1 bg-green-50/30 print:p-2"><input type="number" className="w-full text-center p-1 outline-none bg-transparent font-bold text-green-700 print:hidden" value={d.final||''} onChange={e=>handleChange(student.id, 'final', e.target.value, i)} /><span className="hidden print:inline font-bold">{d.final||'-'}</span></td>
                                        </React.Fragment>
                                      )
                                   })
                                ) : (
                                   <React.Fragment>
                                      <td className="border border-gray-200 print:border-gray-800 p-1 print:p-2"><input type="number" className="w-full text-center p-1 rounded outline-none print:hidden" value={data.original||''} onChange={e=>handleChange(student.id, 'original', e.target.value)} /><span className="hidden print:inline">{data.original||'-'}</span></td>
                                      <td className="border border-gray-200 print:border-gray-800 p-1 bg-yellow-50/30 print:p-2"><input type="number" className="w-full text-center p-1 rounded outline-none bg-transparent print:hidden" value={data.remedial||''} onChange={e=>handleChange(student.id, 'remedial', e.target.value)} /><span className="hidden print:inline">{data.remedial||'-'}</span></td>
                                      <td className="border border-gray-200 print:border-gray-800 p-1 bg-green-50/30 print:p-2"><input type="number" className="w-full text-center p-1 rounded outline-none bg-transparent font-bold text-green-700 print:hidden" value={data.final||''} onChange={e=>handleChange(student.id, 'final', e.target.value)} /><span className="hidden print:inline font-bold">{data.final||'-'}</span></td>
                                   </React.Fragment>
                                )}
                              </tr>
                            )
                         })}
                       </tbody>
                     </table>
                   </div>
                   
                   <div className="hidden print:flex justify-end mt-12">
                      <div className="text-center w-auto px-4">
                        <p>Mengetahui,</p>
                        <p>Guru Mata Pelajaran</p>
                        <div className="h-24"></div>
                        <p className="font-bold underline whitespace-nowrap">{currentTeacher?.name || '..................................'}</p>
                        <p className="whitespace-nowrap">NIP. {currentTeacher?.nip || '........................'}</p>
                      </div>
                   </div>
                   
                 </div>
               ) : (
                  <div className="flex-1 flex items-center justify-center bg-white rounded-xl border border-gray-200 border-dashed">
                    <p className="text-gray-400 text-lg font-medium">Silakan pilih Kelas dan Mata Pelajaran.</p>
                  </div>
               )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

      }
    }, 50);
  </script>
</body>
</html>
