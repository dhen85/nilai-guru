      firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
        apiKey: "AIzaSyAmlyheyJTeeIkKDP8V_65R3DJfah_ERG8",
        authDomain: "nilai-mapel.firebaseapp.com",
        projectId: "nilai-mapel",
        storageBucket: "nilai-mapel.firebasestorage.app",
        messagingSenderId: "753415234022",
        appId: "1:753415234022:web:ee9642f35ca1ec22aff627"

    const Icons = {
      Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
      Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
      Book: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>,
      Database: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>,
      Printer: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
      Save: () => <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>,
      LogOut: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
      Target: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
    };

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95 duration-200">
            <div className="flex justify-between items-center p-5 border-b border-gray-100 bg-gray-50/50">
              <h3 className="text-lg font-semibold text-gray-800">{title}</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 transition-colors">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    };

    function calculateFinalGradeDetail(gradeData, settings) {
      const safeAvg = (arr) => {
        if (!arr || !Array.isArray(arr) || arr.length === 0) return null;
        const nums = arr.map(Number).filter(n => !isNaN(n));
        if (nums.length === 0) return null;
        return nums.reduce((a, b) => a + b, 0) / nums.length;
      };

      const avgTugas = safeAvg(gradeData.tugas);
      const avgKet = safeAvg(gradeData.keterampilan);
      const avgSLM = safeAvg(gradeData.slm);

      let slmComponents = [];
      if (avgTugas !== null) slmComponents.push(avgTugas);
      if (avgKet !== null) slmComponents.push(avgKet);
      if (avgSLM !== null) slmComponents.push(avgSLM);

      const nlm = slmComponents.length > 0 ? slmComponents.reduce((a, b) => a + b, 0) / slmComponents.length : 0;

      const sts = Number(gradeData.sts) || 0;
      const sas = Number(gradeData.sas) || 0;

      const wSLM = Number(settings.weightSLM) / 100;
      const wSTS = Number(settings.weightSTS) / 100;
      const wSAS = Number(settings.weightSAS) / 100;

      const finalGrade = (nlm * wSLM) + (sts * wSTS) + (sas * wSAS);

      return {
         avgTugas: avgTugas || 0,
         avgKet: avgKet || 0,
         avgSLM: avgSLM || 0,
         nlm: nlm,
         sts: sts,
         sas: sas,
         finalGrade: finalGrade
      };
    }
    
    function calculateFinalGrade(gradeData, settings) {
      return calculateFinalGradeDetail(gradeData, settings).finalGrade;
    }

    function App() {
      const [user, setUser] = useState(null);
      const [role, setRole] = useState(null);
      const [loading, setLoading] = useState(true);

      const [settings, setSettings] = useState({ 
        schoolName: "SMA Negeri 1 Nusantara", 
        address: "Jl. Pendidikan No. 1", 
        principal: "Dr. Budi Santoso, M.Pd", 
        nip: "19700101 199512 1 001",
        academicYear: "2026/2027",
        weightSLM: 40, weightSTS: 30, weightSAS: 30 
      });
      const [classes, setClasses] = useState([]);
      const [subjects, setSubjects] = useState([]);
      const [students, setStudents] = useState([]);
      const [grades, setGrades] = useState([]);
      const [objectives, setObjectives] = useState([]);
      const [teachers, setTeachers] = useState([]);
      const [kktps, setKktps] = useState([]);
      const [remedials, setRemedials] = useState([]);
      
      const [currentTeacher, setCurrentTeacher] = useState(null);
      const [loginData, setLoginData] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined') {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (error) {
            console.error("Auth error:", error);
            setLoading(false); // Fallback in case of custom token throw
          }
        };

        const unsubscribe = onAuthStateChanged(auth, (user) => {
          setUser(user);
          if (user) setupSubscriptions();
          setLoading(false);
        });

        initAuth();
        return () => unsubscribe();
      }, []);

      const setupSubscriptions = () => {
        const collections = [
          { name: 'settings', setter: (data) => { if (data.length > 0) setSettings(prev => ({...prev, ...data[0]})) } },
          { name: 'classes', setter: setClasses },
          { name: 'subjects', setter: setSubjects },
          { name: 'students', setter: setStudents },
          { name: 'grades', setter: setGrades },
          { name: 'objectives', setter: setObjectives },
          { name: 'teachers', setter: setTeachers },
          { name: 'kktps', setter: setKktps },
          { name: 'remedials', setter: setRemedials }
        ];

        collections.forEach(({name, setter}) => {
          onSnapshot(getColRef(name), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setter(data);
          }, (error) => console.error(`Error listening to ${name}:`, error));
        });
      };

      if (loading) return (
        <div className="min-h-screen flex items-center justify-center bg-gray-50">
          <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
      );

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        if (loginData.username === 'admin' && loginData.password === 'admin') {
          setRole('admin');
          return;
        }
        const teacher = teachers.find(t => t.username === loginData.username && t.password === loginData.password);
        if (teacher) {
          setCurrentTeacher(teacher);
          setRole('teacher');
        } else {
          setLoginError('Username atau password salah! (Gunakan admin/admin untuk Admin)');
        }
      };

      if (!role) {
        return (
          <div className="min-h-screen flex bg-white">
            <div className="hidden lg:flex lg:w-1/2 relative bg-indigo-900">
              <img src="https://images.unsplash.com/photo-1577896851231-70ef18881754?ixlib=rb-4.0.3&auto=format&fit=crop&w=1080&q=80" alt="Education" className="absolute inset-0 w-full h-full object-cover opacity-60 mix-blend-overlay" />
              <div className="absolute inset-0 flex flex-col justify-center px-16 text-white">
                <div className="w-20 h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mb-6 shadow-xl border border-white/30">
                  <Icons.Book />
                </div>
                <h1 className="text-5xl font-bold mb-4 leading-tight">EduGrade<br/>Portal</h1>
                <p className="text-xl text-indigo-100 max-w-md">Sistem Informasi Pengolahan Nilai Sumatif Terpadu. Masuk untuk mengelola data akademik sekolah.</p>
              </div>
            </div>
            
            <div className="w-full lg:w-1/2 flex items-center justify-center p-8 bg-gray-50/50">
              <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-10 space-y-8 border border-gray-100">
                <div className="text-center lg:text-left">
                  <h2 className="text-3xl font-bold text-gray-900">Selamat Datang</h2>
                  <p className="text-gray-500 mt-2">Silakan masuk menggunakan akun Anda</p>
                </div>
                {loginError && (
                  <div className="p-4 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm font-medium">
                    {loginError}
                  </div>
                )}
                <form onSubmit={handleLogin} className="space-y-5">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                    <input type="text" required value={loginData.username} onChange={e => setLoginData({...loginData, username: e.target.value})} 
                      className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Masukkan username" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" required value={loginData.password} onChange={e => setLoginData({...loginData, password: e.target.value})} 
                      className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="••••••••" />
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors shadow-lg shadow-indigo-200 mt-4">
                    Masuk ke Portal
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 flex text-gray-800 font-sans">
          {role === 'admin' ? (
            <AdminPortal 
              settings={settings} classes={classes} subjects={subjects} 
              students={students} grades={grades} teachers={teachers} objectives={objectives} kktps={kktps}
              onLogout={() => { setRole(null); setLoginData({username: '', password: ''}); setCurrentTeacher(null); }} 
            />
          ) : (
            <TeacherPortal 
              settings={settings} classes={classes} subjects={subjects} 
              students={students} grades={grades} objectives={objectives}
              teachers={teachers} currentTeacher={currentTeacher} kktps={kktps} remedials={remedials}
              onLogout={() => { setRole(null); setLoginData({username: '', password: ''}); setCurrentTeacher(null); }} 
            />
          )}
        </div>
      );
    }

    function AdminPortal({ settings, classes, subjects, students, grades, teachers, objectives, kktps, onLogout }) {
      const [activeTab, setActiveTab] = useState('settings');

      const navItems = [
        { id: 'settings', label: 'Pengaturan Sekolah', icon: Icons.Settings },
        { id: 'master', label: 'Data Master', icon: Icons.Database },
        { id: 'monitor', label: 'Monitoring Nilai', icon: Icons.Users },
        { id: 'leger', label: 'Cetak Leger (PDF)', icon: Icons.Printer },
      ];

      return (
        <div className="flex w-full min-h-screen">
          <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col print:hidden">
            <div className="p-6 border-b border-slate-800">
              <h2 className="text-white font-bold text-xl flex items-center gap-2">
                <div className="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center text-white">A</div>
                Portal Admin
              </h2>
            </div>
            <nav className="flex-1 p-4 space-y-2">
              {navItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${
                    activeTab === item.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20' : 'hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <item.icon />
                  <span className="font-medium">{item.label}</span>
                </button>
              ))}
            </nav>
            <div className="p-4 border-t border-slate-800">
              <button onClick={onLogout} className="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-slate-800 hover:text-red-300 rounded-xl transition-colors">
                <Icons.LogOut /> <span className="font-medium">Keluar</span>
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col bg-slate-50 min-w-0">
            <header className="bg-white border-b border-gray-200 p-6 flex justify-between items-center print:hidden">
              <h1 className="text-2xl font-bold text-gray-800">
                {navItems.find(i => i.id === activeTab)?.label}
              </h1>
              <div className="text-sm text-gray-500 font-medium">
                {settings.schoolName}
              </div>
            </header>

            <div className="p-6 overflow-auto flex-1">
              {activeTab === 'settings' && <AdminSettings settings={settings} />}
              {activeTab === 'master' && <AdminMasterData classes={classes} subjects={subjects} students={students} teachers={teachers} />}
              {activeTab === 'monitor' && <AdminMonitor grades={grades} classes={classes} subjects={subjects} teachers={teachers} />}
              {activeTab === 'leger' && <AdminLeger settings={settings} classes={classes} subjects={subjects} students={students} grades={grades} teachers={teachers} objectives={objectives} kktps={kktps} />}
            </div>
          </main>
        </div>
      );
    }

    function AdminSettings({ settings }) {
      const [formData, setFormData] = useState(settings);
      const [saving, setSaving] = useState(false);

      useEffect(() => { setFormData(settings); }, [settings]);

      const handleSave = async () => {
        if (!auth.currentUser) return;
        setSaving(true);
        try {
          const settingsRef = getColRef('settings');
          const q = query(settingsRef, limit(1));
          const snapshot = await getDocs(q);
          
          const payload = { ...formData, 
             weightSLM: Number(formData.weightSLM),
             weightSTS: Number(formData.weightSTS),
             weightSAS: Number(formData.weightSAS)
          };

          if (snapshot.empty) {
            await addDoc(settingsRef, payload);
          } else {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', snapshot.docs[0].id), payload);
          }
          setSaving(false);
        } catch (e) {
          console.error(e);
          setSaving(false);
        }
      };

      return (
        <div className="max-w-3xl space-y-8 animate-in fade-in duration-300">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 className="text-lg font-bold mb-4 flex items-center gap-2"><Icons.Book/> Identitas Sekolah</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">Nama Sekolah</label>
                <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" 
                  value={formData.schoolName || ''} onChange={e => setFormData({...formData, schoolName: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">Alamat Sekolah</label>
                <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" 
                  value={formData.address || ''} onChange={e => setFormData({...formData, address: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">Nama Kepala Sekolah</label>
                <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" 
                  value={formData.principal || ''} onChange={e => setFormData({...formData, principal: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">NIP Kepala Sekolah</label>
                <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" 
                  value={formData.nip || ''} onChange={e => setFormData({...formData, nip: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">Tahun Pelajaran</label>
                <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" 
                  value={formData.academicYear || ''} onChange={e => setFormData({...formData, academicYear: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">Semester</label>
                <select className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" 
                  value={formData.semester || 'Ganjil'} onChange={e => setFormData({...formData, semester: e.target.value})}>
                  <option value="Ganjil">Ganjil</option>
                  <option value="Genap">Genap</option>
                </select>
              </div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 className="text-lg font-bold mb-4 flex items-center gap-2"><Icons.Settings/> Bobot Presentase Nilai Akhir</h3>
            <p className="text-sm text-gray-500 mb-4">Total bobot harus 100%. SLM (Sumatif Lingkup Materi) adalah rata-rata dinamis dari komponen (Tugas, Keterampilan, Sumatif Materi) yang diinput.</p>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <label className="block text-sm font-bold text-blue-800 mb-1">Bobot SLM (%)</label>
                <input type="number" className="w-full border border-blue-200 rounded-lg p-2 text-blue-900 bg-white"

            let classId = '';
            if (newItem.className.trim()) {
              const existingClass = classes.find(c => c.name.toLowerCase() === newItem.className.trim().toLowerCase());
              if (existingClass) classId = existingClass.id;
              else classId = (await addDoc(getColRef('classes'), { name: newItem.className.trim() })).id;
            }
            payload.classId = classId;
          }
          if (activeSubTab === 'teachers') {
            let subjectId = '';
            if (newItem.subjectName.trim()) {
              const existingSubj = subjects.find(s => s.name.toLowerCase() === newItem.subjectName.trim().toLowerCase());
              if (existingSubj) subjectId = existingSubj.id;
              else subjectId = (await addDoc(getColRef('subjects'), { name: newItem.subjectName.trim() })).id;
            }
            payload = { ...payload, nip: newItem.nip || '', subjectId: subjectId, username: newItem.username || '', password: newItem.password || '' };

    function AdminLeger({ settings, classes, subjects, students, grades, teachers, objectives, kktps }) {
      const [selectedClass, setSelectedClass] = useState('');
      const [selectedSubject, setSelectedSubject] = useState('');
      
      const classStudents = students.filter(s => s.classId === selectedClass);
      const isMapelLeger = !!selectedSubject;
      const targetSubjects = isMapelLeger ? subjects.filter(s => s.id === selectedSubject) : subjects;

      const getPredikat = (na, subjectId) => {
         if (typeof na !== 'number') return '-';
         const kktpData = kktps?.find(k => k.classId === selectedClass && k.subjectId === subjectId);
         if (!kktpData || !kktpData.predicates) return '-';
         const p = kktpData.predicates;
         if (na >= p.A.min) return 'A';
         if (na >= p.B.min) return 'B';
         if (na >= p.C.min) return 'C';
         return 'D';
      };

      const legerData = useMemo(() => {
        if (!selectedClass) return [];
        return classStudents.map(student => {
          const studentGrades = {};
          let total = 0;
          
          if (isMapelLeger) {
            const gradeRecord = grades.find(g => g.studentId === student.id && g.subjectId === selectedSubject) || {};
            const details = calculateFinalGradeDetail(gradeRecord, settings);
            
            studentGrades['detail'] = {
              tugas: details.avgTugas, ket: details.avgKet, slm: details.avgSLM, // Fixed reference here
              sts: details.sts, sas: details.sas, final: details.finalGrade,
              predikat: getPredikat(details.finalGrade, selectedSubject)
            };
            total = details.finalGrade;
          } else {
            subjects.forEach(subject => {
              const gradeRecord = grades.find(g => g.studentId === student.id && g.subjectId === subject.id);
              const finalGrade = gradeRecord ? calculateFinalGrade(gradeRecord, settings) : 0;
              studentGrades[subject.id] = finalGrade;
              total += finalGrade;
            });
          }
          
          return { student, grades: studentGrades, total, average: isMapelLeger ? total : (subjects.length ? (total / subjects.length) : 0) };
        }).sort((a, b) => b.total - a.total); 
      }, [selectedClass, selectedSubject, classStudents, grades, subjects, settings, isMapelLeger, kktps]);

      const handlePrint = () => window.print();
      const selectedTeacher = isMapelLeger ? teachers?.find(t => t.subjectId === selectedSubject) : null;
      const subjectObjectives = isMapelLeger ? objectives?.filter(o => o.subjectId === selectedSubject && o.classId === selectedClass) : [];

      return (
        <div className="space-y-6 animate-in fade-in duration-300">

              <select className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white"

                {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}

            </div>
            <button onClick={handlePrint} disabled={!selectedClass} className="flex items-center gap-2 bg-slate-800 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-slate-900 disabled:opacity-50 transition-colors">
              <Icons.Printer /> Cetak PDF
            </button>
          </div>

          {selectedClass && (
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 print:p-0 print:border-none print:shadow-none">
              <div className="text-center mb-6 pb-4 border-b-2 border-gray-800">

                </div>
                {isMapelLeger && (
                   <p className="font-bold text-lg mt-1 text-indigo-700">Mata Pelajaran: {targetSubjects[0]?.name}</p>
                )}
              </div>

              <div className="overflow-x-auto print:overflow-visible">
                <table className="w-full text-sm border-collapse border border-gray-800">
                  <thead>
                    {isMapelLeger ? (
                      <tr className="bg-gray-100 print:bg-gray-200 text-gray-800">

    function TeacherObjectives({ subjects, classes, objectives, kktps, currentTeacher }) {
      const [selectedClass, setSelectedClass] = useState('');
      const [objectiveText, setObjectiveText] = useState('');
      
      const currentSubjectId = currentTeacher?.subjectId;
      const currentSubject = subjects.find(s => s.id === currentSubjectId);
      
      const filteredObjectives = objectives.filter(o => o.subjectId === currentSubjectId && o.classId === selectedClass);

      const [kktpVal, setKktpVal] = useState(75);
      const [predicates, setPredicates] = useState({
        A: { min: 92, max: 100, label: 'Sangat Baik' },
        B: { min: 84, max: 91, label: 'Baik' },
        C: { min: 75, max: 83, label: 'Cukup' },
        D: { min: 0, max: 74, label: 'Kurang' }
      });
      const [savingKktp, setSavingKktp] = useState(false);
      const [currentKktpDocId, setCurrentKktpDocId] = useState(null);

      const handleKktpChange = (val) => {
         setKktpVal(val);
         const kktp = Number(val);
         
         if (kktp >= 0 && kktp <= 100) {
             const interval = Math.round((100 - kktp) / 3);
             const cMax = kktp + interval - 1;
             const bMin = cMax + 1;
             const bMax = bMin + interval - 1;
             const aMin = bMax + 1;
             
             setPredicates({
                 A: { min: aMin > 100 ? 100 : aMin, max: 100, label: 'Sangat Baik' },
                 B: { min: bMin > 100 ? 100 : bMin, max: bMax > 100 ? 100 : bMax, label: 'Baik' },
                 C: { min: kktp, max: cMax > 100 ? 100 : cMax, label: 'Cukup' },
                 D: { min: 0, max: kktp - 1 < 0 ? 0 : kktp - 1, label: 'Kurang' }
             });
         }
      };

      useEffect(() => {
        if(selectedClass && currentSubjectId) {
          const existing = kktps.find(k => k.classId === selectedClass && k.subjectId === currentSubjectId);
          if(existing) {
            setKktpVal(existing.kktp);
            if(existing.predicates) setPredicates(existing.predicates);
            setCurrentKktpDocId(existing.id);
          } else {
            setCurrentKktpDocId(null);
            handleKktpChange(75); 
          }
        }
      }, [selectedClass, currentSubjectId, kktps]);

      const handleSaveKktp = async () => {
        if (!selectedClass || !currentSubjectId) return;
        setSavingKktp(true);
        try {
          const payload = {
            classId: selectedClass, subjectId: currentSubjectId,
            kktp: Number(kktpVal), predicates: predicates
          };
          if (currentKktpDocId) {
            await updateDoc(getDocRef('kktps', currentKktpDocId), payload);
          } else {
            await addDoc(getColRef('kktps'), payload);
          }
        } catch (e) {
          console.error(e);
        }
        setSavingKktp(false);
      };

      const handleAddTP = async () => {
        if (!objectiveText.trim() || !selectedClass || !currentSubjectId) return;
        try {
          await addDoc(getColRef('objectives'), { text: objectiveText, classId: selectedClass, subjectId: currentSubjectId });
          setObjectiveText('');
        } catch (e) { console.error(e); }
      };

      const handleDeleteTP = async (id) => {
        try { await deleteDoc(getDocRef('objectives', id)); } catch (e) { console.error(e); }
      };

      return (
        <div className="space-y-6 animate-in fade-in duration-300 flex flex-col h-full overflow-auto">
           <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-end shrink-0">
             <div className="flex-1 min-w-[200px]">
                <label className="block text-sm font-bold text-gray-700 mb-1">Pilih Kelas</label>
                <select className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
                  value={selectedClass} onChange={e => setSelectedClass(e.target.value)}>
                  <option value="">-- Pilih Kelas --</option>
                  {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
             </div>
             <div className="flex-1 min-w-[200px]">
                <label className="block text-sm font-bold text-gray-700 mb-1">Mata Pelajaran</label>
                <div className="w-full border border-gray-200 bg-gray-50 rounded-lg p-2 text-gray-600 font-medium h-[42px] flex items-center">
                   {currentSubject?.name || 'Belum diatur (Hubungi Admin)'}
                </div>
             </div>
           </div>

           {selectedClass ? (
             <div className="flex flex-col gap-6 h-full pb-6">
                
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 shrink-0 relative overflow-hidden">
                   <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-full blur-3xl -mr-10 -mt-10"></div>
                   <h3 className="font-bold text-gray-800 mb-4 relative z-10 flex items-center gap-2">
                     <Icons.Target /> Pengaturan KKTP & Rentang Predikat Otomatis
                   </h3>
                   <div className="grid grid-cols-2 md:grid-cols-5 gap-4 relative z-10">
                       <div className="bg-indigo-50 border border-indigo-100 p-3 rounded-lg flex flex-col justify-center shadow-inner">
                           <label className="block text-xs font-bold text-indigo-800 mb-1 text-center">Batas Nilai KKTP</label>
                           <input type="number" className="w-full text-center p-2 rounded border border-indigo-200 font-bold text-xl text-indigo-700 outline-none focus:ring-2 focus:ring-indigo-500" 
                             value={kktpVal} onChange={(e) => handleKktpChange(e.target.value)} />
                       </div>
                       {['A', 'B', 'C', 'D'].map(grade => (
                          <div key={grade} className={`p-3 rounded-lg border flex flex-col ${grade === 'D' ? 'bg-red-50 border-red-100' : grade === 'C' ? 'bg-orange-50 border-orange-100' : grade === 'B' ? 'bg-green-50 border-green-100' : 'bg-blue-50 border-blue-100'}`}>
                              <div className={`text-center font-bold text-lg mb-1 ${grade === 'D' ? 'text-red-700' : grade === 'C' ? 'text-orange-700' : grade === 'B' ? 'text-green-700' : 'text-blue-700'}`}>{grade}</div>
                              <div className="text-[10px] text-center font-semibold text-gray-500 mb-1 uppercase tracking-wide">{predicates[grade]?.label}</div>
                              <div className="flex items-center gap-1 justify-center mt-auto">
                                 <input type="number" className="w-12 text-center p-1 rounded border border-gray-200 text-xs font-semibold" value={predicates[grade]?.min || 0} onChange={(e) => setPredicates({...predicates, [grade]: {...predicates[grade], min: e.target.value}})} />
                                 <span className="text-gray-400 text-xs">-</span>
                                 <input type="number" className="w-12 text-center p-1 rounded border border-gray-200 text-xs font-semibold" value={predicates[grade]?.max || 0} onChange={(e) => setPredicates({...predicates, [grade]: {...predicates[grade], max: e.target.value}})} />
                              </div>
                          </div>
                       ))}
                   </div>
                   <div className="mt-4 flex justify-end relative z-10">
                      <button onClick={handleSaveKktp} disabled={savingKktp} className="bg-indigo-600 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition-colors flex items-center gap-2">
                        <Icons.Save /> {savingKktp ? 'Menyimpan...' : 'Simpan Pengaturan KKTP'}
                      </button>
                   </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col flex-1">
                   <div className="p-4 border-b border-gray-200 bg-gray-50 flex gap-2 shrink-0">
                      <input type="text" className="flex-1 border border-gray-300 rounded-lg p-2 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" 
                         placeholder="Masukkan Tujuan Pembelajaran (TP)... (misal: Peserta didik mampu...)" 
                         value={objectiveText} onChange={e => setObjectiveText(e.target.value)}
                         onKeyDown={e => e.key === 'Enter' && handleAddTP()} />
                      <button onClick={handleAddTP} disabled={!objectiveText.trim()} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-50 transition-colors whitespace-nowrap flex items-center gap-1">
                         <Icons.Plus /> Tambah TP
                      </button>
                   </div>
                   <div className="flex-1 overflow-auto p-0">
                     {filteredObjectives.length === 0 ? (
                       <div className="p-12 text-center text-gray-400 font-medium">Belum ada Tujuan Pembelajaran (TP) yang ditambahkan untuk kelas ini.</div>
                     ) : (
                       <ul className="divide-y divide-gray-100">
                         {filteredObjectives.map((obj, idx) => (
                           <li key={obj.id} className="p-4 flex items-center gap-4 hover:bg-gray-50 transition-colors">
                             <span className="bg-indigo-100 text-indigo-700 font-bold text-xs px-2.5 py-1 rounded-md shrink-0">TP {idx + 1}</span>
                             <p className="flex-1 text-sm text-gray-700 leading-relaxed">{obj.text}</p>
                             <button onClick={() => handleDeleteTP(obj.id)} className="text-red-400 hover:bg-red-50 hover:text-red-600 px-3 py-1.5 rounded-lg transition-colors shrink-0 font-medium text-sm">Hapus</button>
                           </li>
                         ))}
                       </ul>
                     )}
                   </div>
                </div>
             </div>
           ) : (
             <div className="flex-1 flex items-center justify-center bg-white rounded-xl border border-gray-200 border-dashed p-10">
                <p className="text-gray-400 text-lg font-medium">Silakan pilih Kelas terlebih dahulu untuk mengelola TP dan KKTP.</p>
             </div>
           )}
        </div>
      );
    }

    function TeacherInputGrades({ mode, settings, classes, subjects, students, grades, objectives, kktps, currentTeacher }) {
      const [selectedClass, setSelectedClass] = useState('');
      const [selectedSubject, setSelectedSubject] = useState(currentTeacher?.subjectId || '');
      const [cols, setCols] = useState({ tugas: 1, keterampilan: 1, slm: 1 });
      const [tempGrades, setTempGrades] = useState({});
      const [saving, setSaving] = useState(false);

      const classStudents = useMemo(() => students.filter(s => s.classId === selectedClass), [students, selectedClass]);
      const kktpData = useMemo(() => kktps.find(k => k.classId === selectedClass && k.subjectId === selectedSubject), [kktps, selectedClass, selectedSubject]);

      useEffect(() => {
        if (!selectedClass || !selectedSubject) return;
        
        const newTemp = {};
        let maxTugas = 1, maxKet = 1, maxSlm = 1;

        classStudents.forEach(student => {
          const existing = grades.find(g => g.studentId === student.id && g.subjectId === selectedSubject && g.classId === selectedClass);
          if (existing) {
            newTemp[student.id] = {
              tugas: existing.tugas || [''],
              keterampilan: existing.keterampilan || [''],
              slm: existing.slm || [''],
              sts: existing.sts || '',
              sas: existing.sas || '',
              id: existing.id
            };
            maxTugas = Math.max(maxTugas, (existing.tugas || []).length);
            maxKet = Math.max(maxKet, (existing.keterampilan || []).length);
            maxSlm = Math.max(maxSlm, (existing.slm || []).length);
          } else {
            newTemp[student.id] = { tugas: [''], keterampilan: [''], slm: [''], sts: '', sas: '' };
          }
        });

        setTempGrades(newTemp);
        setCols({ tugas: Math.max(1, maxTugas), keterampilan: Math.max(1, maxKet), slm: Math.max(1, maxSlm) });
      }, [selectedClass, selectedSubject, classStudents, grades]);

      const handleGradeChange = (studentId, category, index, value) => {
        setTempGrades(prev => {
          const studentData = { ...prev[studentId] };
          if (category === 'sts' || category === 'sas') {
            studentData[category] = value;
          } else {
            const arr = [...studentData[category]];
            while(arr.length <= index) arr.push('');
            arr[index] = value;
            studentData[category] = arr;
          }
          return { ...prev, [studentId]: studentData };
        });
      };

      const addColumn = (category) => setCols(prev => ({ ...prev, [category]: prev[category] + 1 }));

      const getPredikat = (na) => {
         if (typeof na !== 'number') return '-';
         if (!kktpData || !kktpData.predicates) return '-';
         const p = kktpData.predicates;
         if (na >= p.A.min) return 'A';
         if (na >= p.B.min) return 'B';
         if (na >= p.C.min) return 'C';
         return 'D';
      };

      const handleSaveAll = async () => {
        if (!auth.currentUser || !selectedClass || !selectedSubject) return;
        setSaving(true);
        try {
          const promises = classStudents.map(student => {
            const data = tempGrades[student.id];
            const cleanTugas = data.tugas.map(v => v === '' ? null : Number(v)).filter(v => v !== null);
            const cleanKet = data.keterampilan.map(v => v === '' ? null : Number(v)).filter(v => v !== null);
            const cleanSlm = data.slm.map(v => v === '' ? null : Number(v)).filter(v => v !== null);
            
            const payload = {
              studentId: student.id,
              classId: selectedClass,
              subjectId: selectedSubject,
              tugas: cleanTugas.length ? cleanTugas : [],
              keterampilan: cleanKet.length ? cleanKet : [],
              slm: cleanSlm.length ? cleanSlm : [],
              sts: data.sts !== '' ? Number(data.sts) : null,
              sas: data.sas !== '' ? Number(data.sas) : null,
            };

            if (data.id) return updateDoc(getDocRef('grades', data.id), payload);
            else return addDoc(getColRef('grades'), payload);
          });
          await Promise.all(promises);
        } catch (e) { console.error(e); }
        setSaving(false);
      };

      return (
        <div className="flex flex-col h-full space-y-4 animate-in fade-in duration-300">
          <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-end shrink-0">
            <div className="flex-1 min-w-[200px]">
              <label className="block text-sm font-bold text-gray-700 mb-1">Kelas</label>
              <select className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                value={selectedClass} onChange={e => setSelectedClass(e.target.value)}
              >
                <option value="">-- Pilih Kelas --</option>
                {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
            <div className="flex-1 min-w-[200px]">
              <label className="block text-sm font-bold text-gray-700 mb-1">Mata Pelajaran</label>
              <select className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                value={selectedSubject} onChange={e => setSelectedSubject(e.target.value)}
              >
                <option value="">-- Pilih Mapel --</option>
                {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <button onClick={handleSaveAll} disabled={saving || !selectedClass || !selectedSubject || classStudents.length===0} 
              className="flex items-center justify-center gap-2 bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700 disabled:opacity-50 h-[42px] min-w-[140px] transition-colors shadow-sm">
              <Icons.Save /> {saving ? 'Menyimpan...' : 'Simpan Nilai'}
            </button>
          </div>

          {selectedClass && selectedSubject ? (
            classStudents.length === 0 ? (
               <div className="flex-1 flex items-center justify-center bg-white rounded-xl border border-gray-200">
                 <p className="text-gray-400 font-medium">Belum ada siswa di kelas ini.</p>
               </div>
            ) : (
              <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <div className="p-3 border-b border-gray-200 bg-gray-50 flex gap-2 overflow-x-auto shrink-0 justify-between items-center">
                  <div className="flex gap-2">
                     {mode === 'tugas' && <button onClick={()=>addColumn('tugas')} className="text-xs bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded shadow-sm hover:bg-gray-100 font-semibold flex items-center gap-1"><Icons.Plus /> Kolom Tugas</button>}
                     {mode === 'keterampilan' && <button onClick={()=>addColumn('keterampilan')} className="text-xs bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded shadow-sm hover:bg-gray-100 font-semibold flex items-center gap-1"><Icons.Plus /> Kolom Keterampilan</button>}
                     {mode === 'slm' && <button onClick={()=>addColumn('slm')} className="text-xs bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded shadow-sm hover:bg-gray-100 font-semibold flex items-center gap-1"><Icons.Plus /> Kolom Sumatif Materi</button>}
                     {mode === 'rekap' && <div className="text-sm text-gray-600 font-bold px-2 py-1">Rekapitulasi Nilai Akhir Siswa</div>}
                     {(mode === 'sts' || mode === 'sas') && <div className="text-sm text-gray-600 font-bold px-2 py-1">Input Nilai {mode.toUpperCase()}</div>}
                  </div>
                  {mode === 'rekap' && !kktpData && (
                     <div className="text-xs font-bold text-red-500 bg-red-50 px-2 py-1 rounded border border-red-200">⚠ Harap atur KKTP terlebih dahulu agar predikat muncul.</div>
                  )}
                </div>
                
                <div className="flex-1 overflow-auto relative">
                  <table className="w-full text-sm text-center border-collapse">
                    <thead className="bg-gray-100 text-gray-700 sticky top-0 z-20 shadow-sm border-b border-gray-300">
                      <tr>
                        <th rowSpan={mode === 'tugas' || mode === 'keterampilan' || mode === 'slm' ? "2" : "1"} className="border border-gray-200 p-2 min-w-[200px] sticky left-0 bg-gray-100 z-30 shadow-[1px_0_0_0_#e5e7eb]">Nama Siswa</th>
                        {(mode === 'tugas' || mode === 'rekap') && <th colSpan={mode==='rekap'? 1 : cols.tugas} className="border border-gray-200 p-2 bg-blue-50 text-blue-800">{mode==='rekap'?'Rata-rata Tugas':'Nilai Tugas'}</th>}
                        {(mode === 'keterampilan' || mode === 'rekap') && <th colSpan={mode==='rekap'? 1 : cols.keterampilan} className="border border-gray-200 p-2 bg-orange-50 text-orange-800">{mode==='rekap'?'Rata-rata Keterampilan':'Keterampilan / Projek'}</th>}
                        {(mode === 'slm' || mode === 'rekap') && <th colSpan={mode==='rekap'? 1 : cols.slm} className="border border-gray-200 p-2 bg-purple-50 text-purple-800">{mode==='rekap'?'Rata-rata SLM (Dinamis)':'Sumatif Lingkup Materi'}</th>}
                        {(mode === 'sts' || mode === 'rekap') && <th rowSpan={mode === 'tugas' || mode === 'keterampilan' || mode === 'slm' ? "2" : "1"} className="border border-gray-200 p-2 w-20 bg-green-50 text-green-800">STS</th>}
                        {(mode === 'sas' || mode === 'rekap') && <th rowSpan={mode === 'tugas' || mode === 'keterampilan' || mode === 'slm' ? "2" : "1"} className="border border-gray-200 p-2 w-20 bg-green-50 text-green-800">SAS</th>}
                        {mode === 'rekap' && <th rowSpan="1" className="border border-gray-200 p-2 w-24 bg-gray-800 text-white shadow-[-1px_0_0_0_#e5e7eb]">Nilai Akhir (NA)</th>}
                        {mode === 'rekap' && <th rowSpan="1" className="border border-gray-200 p-2 w-20 bg-indigo-50 text-indigo-800">Predikat</th>}
                      </tr>
                      {(mode === 'tugas' || mode === 'keterampilan' || mode === 'slm') && (
                        <tr>
                          {mode === 'tugas' && Array.from({length: cols.tugas}).map((_, i) => (
                             <th key={`th-t-${i}`} className="border border-gray-200 p-1 w-24 bg-blue-50/50 text-xs text-gray-600 font-medium align-top">
                               <div className="mb-1">T{i+1}</div>
                               <select className="w-full text-[10px] p-1 rounded border border-gray-300 bg-white" title="Pilih Tujuan Pembelajaran">
                                 <option value="">-- Pilih TP --</option>
                                 {objectives?.filter(o => o.classId === selectedClass && o.subjectId === selectedSubject).map((tp, idx) => (
                                   <option key={tp.id} value={tp.id}>TP {idx+1}</option>
                                 ))}
                               </select>
                             </th>
                          ))}
                          {mode === 'keterampilan' && Array.from({length: cols.keterampilan}).map((_, i) => (
                             <th key={`th-k-${i}`} className="border border-gray-200 p-1 w-24 bg-orange-50/50 text-xs text-gray-600 font-medium align-top">
                               <div className="mb-1">K{i+1}</div>
                               <select className="w-full text-[10px] p-1 rounded border border-gray-300 bg-white" title="Pilih Tujuan Pembelajaran">
                                 <option value="">-- Pilih TP --</option>
                                 {objectives?.filter(o => o.classId === selectedClass && o.subjectId === selectedSubject).map((tp, idx) => (
                                   <option key={tp.id} value={tp.id}>TP {idx+1}</option>
                                 ))}
                               </select>
                             </th>
                          ))}
                          {mode === 'slm' && Array.from({length: cols.slm}).map((_, i) => (
                             <th key={`th-s-${i}`} className="border border-gray-200 p-1 w-24 bg-purple-50/50 text-xs text-gray-600 font-medium align-top">
                               <div className="mb-1">S{i+1}</div>
                               <select className="w-full text-[10px] p-1 rounded border border-gray-300 bg-white" title="Pilih Tujuan Pembelajaran">
                                 <option value="">-- Pilih TP --</option>
                                 {objectives?.filter(o => o.classId === selectedClass && o.subjectId === selectedSubject).map((tp, idx) => (
                                   <option key={tp.id} value={tp.id}>TP {idx+1}</option>
                                 ))}
                               </select>
                             </th>
                          ))}
                        </tr>
                      )}
                    </thead>
                    <tbody>
                      {classStudents.map((student, idx) => {
                        const data = tempGrades[student.id] || { tugas: [], keterampilan: [], slm: [], sts: '', sas: '' };
                        
                        const details = calculateFinalGradeDetail(data, settings);
                        
                        return (
                          <tr key={student.id} className="hover:bg-gray-50/50">
                            <td className="border border-gray-200 p-2 text-left font-medium sticky left-0 bg-white z-10 shadow-[1px_0_0_0_#e5e7eb]">
                              {idx+1}. {student.name}
                            </td>
                            
                            {mode === 'tugas' && Array.from({length: cols.tugas}).map((_, i) => (
                              <td key={`t-${i}`} className="border border-gray-200 p-1">
                                <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-transparent hover:bg-gray-50 outline-none transition-colors"
                                  value={data.tugas[i] !== undefined ? data.tugas[i] : ''} onChange={e => handleGradeChange(student.id, 'tugas', i, e.target.value)} />
                              </td>
                            ))}
                            {mode === 'rekap' && <td className="border border-gray-200 p-2 text-center bg-blue-50/30 font-medium">{details.avgTugas.toFixed(1)}</td>}
                            
                            {mode === 'keterampilan' && Array.from({length: cols.keterampilan}).map((_, i) => (
                              <td key={`k-${i}`} className="border border-gray-200 p-1">
                                <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-orange-500 focus:ring-1 focus:ring-orange-500 bg-transparent hover:bg-gray-50 outline-none transition-colors"
                                  value={data.keterampilan[i] !== undefined ? data.keterampilan[i] : ''} onChange={e => handleGradeChange(student.id, 'keterampilan', i, e.target.value)} />
                              </td>
                            ))}
                            {mode === 'rekap' && <td className="border border-gray-200 p-2 text-center bg-orange-50/30 font-medium">{details.avgKet.toFixed(1)}</td>}
                            
                            {mode === 'slm' && Array.from({length: cols.slm}).map((_, i) => (
                              <td key={`s-${i}`} className="border border-gray-200 p-1">
                                <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-purple-500 focus:ring-1 focus:ring-purple-500 bg-transparent hover:bg-gray-50 outline-none transition-colors"
                                  value={data.slm[i] !== undefined ? data.slm[i] : ''} onChange={e => handleGradeChange(student.id, 'slm', i, e.target.value)} />
                              </td>
                            ))}
                            {mode === 'rekap' && <td className="border border-gray-200 p-2 text-center bg-purple-50/30 font-bold text-purple-800">{details.nlm.toFixed(1)}</td>}
                            
                            {(mode === 'sts' || mode === 'rekap') && (
                              <td className="border border-gray-200 p-1">
                                {mode === 'rekap' ? <div className="p-1 font-bold text-green-700">{details.sts}</div> :
                                <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-green-500 focus:ring-1 focus:ring-green-500 font-bold text-green-700 bg-transparent hover:bg-green-50 outline-none"
                                  value={data.sts} onChange={e => handleGradeChange(student.id, 'sts', null, e.target.value)} />}
                              </td>
                            )}
                            {(mode === 'sas' || mode === 'rekap') && (
                              <td className="border border-gray-200 p-1">
                                {mode === 'rekap' ? <div className="p-1 font-bold text-green-700">{details.sas}</div> :
                                <input type="number" min="0" max="100" className="w-full text-center p-1 rounded border-transparent focus:border-green-500 focus:ring-1 focus:ring-green-500 font-bold text-green-700 bg-transparent hover:bg-green-50 outline-none"
                                  value={data.sas} onChange={e => handleGradeChange(student.id, 'sas', null, e.target.value)} />}
                              </td>
                            )}
                            
                            {mode === 'rekap' && (
                              <td className="border border-gray-200 p-2 font-bold text-lg bg-gray-50 shadow-[-1px_0_0_0_#e5e7eb]">
                                {details.finalGrade.toFixed(0)}
                              </td>
                            )}
                            {mode === 'rekap' && (
                               <td className="border border-gray-200 p-2 font-bold text-indigo-700">
                                 {getPredikat(details.finalGrade)}
                               </td>
                            )}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )
          ) : (
            <div className="flex-1 flex items-center justify-center bg-white rounded-xl border border-gray-200 border-dashed">
              <p className="text-gray-400 text-lg font-medium">Silakan pilih Kelas dan Mata Pelajaran untuk mulai menginput nilai.</p>
            </div>
          )}
        </div>
      );
    }

    function TeacherRemedial({ classes, subjects, students, remedials, currentTeacher }) {
      const [selectedType, setSelectedType] = useState('SLM'); 
      const [slmIndex, setSlmIndex] = useState(1);
      const [selectedClass, setSelectedClass] = useState('');
      const [selectedSubject, setSelectedSubject] = useState(currentTeacher?.subjectId || '');
      
      const [minKatrol, setMinKatrol] = useState(75);
      const [maxKatrol, setMaxKatrol] = useState(85);
      const [saving, setSaving] = useState(false);

      const classStudents = useMemo(() => students.filter(s => s.classId === selectedClass), [students, selectedClass]);
      const [tempRemedial, setTempRemedial] = useState({});

      useEffect(() => {
        if (!selectedClass || !selectedSubject) return;
        const newTemp = {};
        classStudents.forEach(student => {
           const rec = remedials.find(r => r.studentId === student.id && r.subjectId === selectedSubject && r.classId === selectedClass);
           let data = { original: '', remedial: '', final: '', id: rec ? rec.id : null };
           if (rec) {
              if (selectedType === 'SLM' && rec.slm && rec.slm[slmIndex]) {
                 data = { ...rec.slm[slmIndex], id: rec.id };
              } else if (selectedType === 'STS' && rec.sts) {
                 data = { ...rec.sts, id: rec.id };
              } else if (selectedType === 'SAS' && rec.sas) {
                 data = { ...rec.sas, id: rec.id };
              }
           }
           newTemp[student.id] = data;
        });
        setTempRemedial(newTemp);
      }, [selectedClass, selectedSubject, selectedType, slmIndex, classStudents, remedials]);

      const handleRemedialChange = (studentId, field, val) => {
         setTempRemedial(prev => {
            const data = prev[studentId] || { original: '', remedial: '', final: '' };
            let newData = { ...data, [field]: val };
            
            if (field === 'remedial') {
               const remedNum = Number(val);
               const minK = Number(minKatrol);
               const maxK = Number(maxKatrol);
               if (!isNaN(remedNum) && val !== '' && !isNaN(minK) && !isNaN(maxK)) {
                  newData.final = Math.round(minK + ((remedNum / 100) * (maxK - minK)));
               } else {
                  newData.final = '';
               }
            }
            return { ...prev, [studentId]: newData };
         });
      };

      const handleSaveRemedial = async () => {
         if (!selectedClass || !selectedSubject || !auth.currentUser) return;
         setSaving(true);
         try {
            const promises = classStudents.map(student => {
               const data = tempRemedial[student.id];
               if (!data.original && !data.remedial && !data.final) return null;
               
               const existingRec = remedials.find(r => r.studentId === student.id && r.subjectId === selectedSubject && r.classId === selectedClass);
               
               let payload = existingRec ? { ...existingRec } : { studentId: student.id, classId: selectedClass, subjectId: selectedSubject };
               
               const payloadData = { 
                   original: Number(data.original)||0, 
                   remedial: Number(data.remedial)||0, 
                   final: Number(data.final)||0 
               };

               if (selectedType === 'SLM') {
                  payload.slm = payload.slm || {};
                  payload.slm[slmIndex] = payloadData;
               } else if (selectedType === 'STS') {
                  payload.sts = payloadData;
               } else if (selectedType === 'SAS') {
                  payload.sas = payloadData;
               }

               if (data.id) {
                  return updateDoc(getDocRef('remedials', data.id), payload);
               } else {
                  return addDoc(getColRef('remedials'), payload);
               }
            }).filter(p => p !== null);

            await Promise.all(promises);
         } catch (e) { console.error(e); }
         setSaving(false);
      };

      return (
        <div className="flex flex-col h-full space-y-4 animate-in fade-in duration-300">
           <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-4 shrink-0">
             
             <div className="flex flex-wrap gap-4 items-end pb-4 border-b border-gray-100">
                <div className="flex-1 min-w-[200px] bg-yellow-50/50 p-3 rounded-lg border border-yellow-200">
                   <h4 className="text-sm font-bold text-yellow-800 mb-2">Rentang Nilai Katrol Akhir</h4>
                   <div className="flex items-center gap-2">
                     <div className="flex-1">
                        <label className="block text-xs font-semibold text-yellow-700 mb-1">Terendah (Min)</label>
                        <input type="number" className="w-full border border-yellow-300 rounded p-1.5 text-sm font-bold text-center"
                          value={minKatrol} onChange={e => setMinKatrol(e.target.value)} />
                     </div>
                     <span className="text-yellow-600 font-bold mt-4">-</span>
                     <div className="flex-1">
                        <label className="block text-xs font-semibold text-yellow-700 mb-1">Tertinggi (Max)</label>
                        <input type="number" className="w-full border border-yellow-300 rounded p-1.5 text-sm font-bold text-center"
                          value={maxKatrol} onChange={e => setMaxKatrol(e.target.value)} />
                     </div>
                   </div>
                </div>
                <div className="flex-[2] text-sm text-gray-500 font-medium">
                   Nilai Akhir akan otomatis dikalkulasi secara proporsional sesuai rentang Katrol berdasarkan persentase nilai Remedial yang dicapai siswa.
                </div>
             </div>

             <div className="flex flex-wrap gap-4 items-end">
               <div>
                  <label className="block text-sm font-bold text-gray-700 mb-1">Jenis Remedial</label>
                  <select className="w-full border border-gray-300 rounded-lg p-2 outline-none"
                    value={selectedType} onChange={e => setSelectedType(e.target.value)}>
                    <option value="SLM">Sumatif Lingkup Materi (SLM)</option>
                    <option value="STS">Sumatif Tengah Semester (STS)</option>
                    <option value="SAS">Sumatif Akhir Semester (SAS)</option>
                  </select>
               </div>
               {selectedType === 'SLM' && (
                 <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">SLM Ke-</label>
                    <div className="flex items-center gap-1">
                       <button onClick={()=>setSlmIndex(Math.max(1, slmIndex-1))} className="bg-gray-200 px-2 py-2 rounded font-bold hover:bg-gray-300">-</button>
                       <input type="number" min="1" className="w-16 border border-gray-300 rounded p-2 text-center outline-none"
                          value={slmIndex} onChange={e => setSlmIndex(Number(e.target.value))} />
                       <button onClick={()=>setSlmIndex(slmIndex+1)} className="bg-gray-200 px-2 py-2 rounded font-bold hover:bg-gray-300">+</button>
                    </div>
                 </div>
               )}
               <div className="flex-1 min-w-[150px]">
                  <label className="block text-sm font-bold text-gray-700 mb-1">Kelas</label>
                  <select className="w-full border border-gray-300 rounded-lg p-2 outline-none"
                    value={selectedClass} onChange={e => setSelectedClass(e.target.value)}>
                    <option value="">-- Pilih Kelas --</option>
                    {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
               </div>
               <div className="flex-1 min-w-[150px]">
                  <label className="block text-sm font-bold text-gray-700 mb-1">Mapel</label>
                  <div className="w-full border border-gray-200 bg-gray-50 rounded-lg p-2 text-gray-600 font-medium h-[42px] flex items-center">
                     {subjects.find(s=>s.id === selectedSubject)?.name}
                  </div>
               </div>
               <button onClick={handleSaveRemedial} disabled={saving || !selectedClass} className="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700 transition-colors h-[42px] flex items-center gap-2">
                 <Icons.Save /> {saving ? 'Menyimpan...' : 'Simpan Remedial'}
               </button>
             </div>
           </div>

           {selectedClass && selectedSubject ? (
             <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
               <div className="p-3 border-b border-gray-200 bg-red-50 text-red-700 font-semibold text-sm shrink-0 flex items-center justify-between">
                 <span>⚠ Nilai ini bersifat mandiri (terisolasi) dan tidak menimpa nilai asli di buku induk secara otomatis.</span>
               </div>
               <div className="flex-1 overflow-auto">
                 <table className="w-full text-sm text-center border-collapse">
                   <thead className="bg-gray-100 text-gray-700 sticky top-0 z-10 shadow-sm border-b border-gray-300">
                     <tr>
                       <th className="border border-gray-200 p-2 min-w-[200px] sticky left-0 bg-gray-100 z-20 text-left">Nama Siswa</th>
                       <th className="border border-gray-200 p-2 bg-gray-50 w-32">Nilai Asli</th>
                       <th className="border border-gray-200 p-2 bg-yellow-50 text-yellow-800 w-32">Hasil Tes Remedial</th>
                       <th className="border border-gray-200 p-2 bg-green-50 text-green-800 w-32">Nilai Akhir (Dikontrol)</th>
                     </tr>
                   </thead>
                   <tbody>
                     {classStudents.map((student, idx) => {
                        const data = tempRemedial[student.id] || { original: '', remedial: '', final: '' };
                        return (
                          <tr key={student.id} className="hover:bg-gray-50/50">
                            <td className="border border-gray-200 p-2 text-left font-medium sticky left-0 bg-white z-10">{idx+1}. {student.name}</td>
                            <td className="border border-gray-200 p-1">
                              <input type="number" min="0" max="100" className="w-full text-center p-2 rounded outline-none border border-transparent focus:border-gray-400" placeholder="0"
                                value={data.original || ''} onChange={e => handleRemedialChange(student.id, 'original', e.target.value)} />
                            </td>
                            <td className="border border-gray-200 p-1 bg-yellow-50/30">
                              <input type="number" min="0" max="100" className="w-full text-center p-2 rounded outline-none bg-transparent font-semibold border border-transparent focus:border-yellow-400 focus:bg-white" placeholder="0"
                                value={data.remedial || ''} onChange={e => handleRemedialChange(student.id, 'remedial', e.target.value)} />
                            </td>
                            <td className="border border-gray-200 p-1 bg-green-50/30">
                              <input type="number" min="0" max="100" className="w-full text-center p-2 rounded outline-none bg-transparent font-bold text-green-700 border border-transparent focus:border-green-400 focus:bg-white" placeholder="0"
                                value={data.final || ''} onChange={e => handleRemedialChange(student.id, 'final', e.target.value)} />
                            </td>
                          </tr>
                        )
                     })}
                   </tbody>
                 </table>
               </div>
             </div>
           ) : (
              <div className="flex-1 flex items-center justify-center bg-white rounded-xl border border-gray-200 border-dashed">
                <p className="text-gray-400 text-lg font-medium">Silakan pilih Kelas dan Mata Pelajaran untuk mengisi Remedial.</p>
              </div>
           )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
